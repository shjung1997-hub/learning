<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>구구단 타자 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  /* 연습장 한 권: 줄 노트 바탕 + 검정 인쇄 + 파란 펜(학생 답) + 빨간 펜(채점) + 형광펜(지금 할 곳) */
  --paper:#f3f3ef; --sheet:#ffffff; --rule:#dfe5ec; --line:#d3d0c8;
  --ink:#1c1c1c; --pencil:#625f58;
  --blue:#1d4b97; --blue-soft:#e8eef8;
  --red:#cc2f26; --red-soft:#fcebe9;
  --hl:#fff09a;
  --orange:#d7802a; --violet:#5a4aa6; --good:#2c7a49;
  --circleFill:#eef3f9;
  --display:'Gowun Batang','Nanum Myeongjo',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hand:'Nanum Pen Script','Gowun Batang',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--paper);background-image:linear-gradient(transparent 31px,var(--rule) 32px);background-size:100% 32px;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:50px;letter-spacing:-.01em}
h2{font-size:30px}
h3{font-size:21px}
p{margin:0}
b{font-weight:700}
.small{font-size:15px;color:var(--pencil)}
.red{color:var(--red)}
.hl{background:var(--hl);padding:0 4px;font-weight:700;color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 72px;display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:22px}
.label{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:700;letter-spacing:.06em;padding:2px 9px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{font-family:var(--body);font-weight:700;font-size:18px;background:var(--ink);color:#fff;border:1.5px solid var(--ink);border-radius:5px;padding:10px 20px;min-height:50px}
.btn:hover{background:#000}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--sheet);color:var(--ink)}
.btn.ghost:hover{background:var(--hl)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{font-size:15px;min-height:40px;padding:5px 14px}
.btn.big{font-size:20px;min-height:58px;width:100%}
.textbtn{background:none;border:0;padding:4px 2px;font-size:15px;color:var(--pencil);text-decoration:underline;text-underline-offset:3px}
.pill{font-weight:600;font-size:16px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;padding:5px 14px;min-height:42px;font-variant-numeric:tabular-nums}
.pill:hover{background:var(--hl)}
.pill.on{background:var(--ink);color:#fff}
.pill.hot{border-style:dashed}
.back{align-self:flex-start}
.warn{color:var(--red);font-weight:700;margin-top:10px}

/* cover */
.cover{background:var(--sheet);border:1.5px solid var(--ink);border-left:14px solid var(--ink);display:grid;grid-template-columns:1fr 230px;gap:20px;padding:30px 28px;align-items:center}
.kicker{font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--pencil)}
.cover .sub{font-family:var(--display);font-size:20px;color:var(--pencil);margin-top:4px}
.nameplate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;border:1.5px solid var(--ink);padding:10px 14px;max-width:420px}
.nameplate label{font-family:var(--display);font-weight:700;font-size:20px}
.nameplate input{flex:1;min-width:8em;font-family:var(--body);font-weight:600;font-size:22px;color:var(--blue);border:0;border-bottom:2px solid var(--ink);background:transparent;padding:4px 2px;border-radius:0}
.nameplate input:focus{outline:none;background:var(--hl)}
.names{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.names .small{margin-right:4px}
.tally{margin-top:14px;font-size:16px;color:var(--pencil)}
.tally b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
.cover-fig svg{width:100%;height:auto}
.cf{font-family:var(--body);font-weight:600;font-size:15px;fill:var(--blue)}
.cf.big{font-size:24px;fill:var(--ink)}
.sec-h{font-size:24px;margin-bottom:6px}
.toc{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.toc li{border-bottom:1px solid var(--line)}
.toc button{display:grid;grid-template-columns:2.2em 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:16px 6px}
.toc .no{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.toc .t{display:block;font-family:var(--display);font-weight:700;font-size:22px}
.toc .d{display:block;font-size:15px;color:var(--pencil);margin-top:2px}
.toc .m{font-size:14px;color:var(--pencil);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.toc button:hover .t{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.toc button:hover{background:#fcfcf8}
.foot{display:flex;gap:10px;justify-content:center;align-items:center;color:var(--pencil)}

/* unit */
.chap{display:flex;gap:16px;align-items:center}
.chap-no{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;border-right:1.5px solid var(--ink);padding-right:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.c1{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.cdots{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.cdots span{width:18px;height:18px;border:1.5px solid var(--ink);background:var(--sheet)}
.cdots span.d{background:var(--ink)}
.cdots span.c{background:var(--hl)}
.keybox{background:var(--sheet);border:1.5px solid var(--ink)}
.keybox h3{background:var(--ink);color:#fff;font-family:var(--body);font-size:15px;letter-spacing:.04em;padding:7px 14px}
.flist{list-style:none;margin:0;padding:8px 16px 12px;display:flex;flex-direction:column}
.flist li{display:grid;grid-template-columns:7.5em 1fr;gap:12px;align-items:baseline;border-bottom:1px dashed var(--line);padding:7px 0}
.flist li:last-child{border-bottom:0}
.flist b{font-size:16px}
.flist span{font-size:17px}
.keybox.big .flist span{font-size:19px}

/* goal */
.goal{display:flex;flex-direction:column;gap:22px}
.mybest{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.mybest .v{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.mybest .v small{font-size:18px;margin-left:2px}
.spark{display:flex;align-items:flex-end;gap:6px;height:76px;padding:20px 4px 0;border-bottom:1.5px solid var(--ink);flex:1;min-width:200px}
.spark div{flex:1;max-width:28px;background:var(--sheet);border:1.5px solid var(--ink);border-bottom:0;position:relative}
.spark div.ok{background:var(--blue-soft);border-color:var(--blue)}
.spark div span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--pencil);font-variant-numeric:tabular-nums}
.goalpick{display:flex;align-items:center;gap:16px;justify-content:center;margin:4px 0 12px}
.goalpick output{font-family:var(--display);font-weight:700;font-size:60px;min-width:2.8em;text-align:center;font-variant-numeric:tabular-nums;border-bottom:2px solid var(--ink);line-height:1.15}
.goalpick output small{font-size:22px;margin-left:2px}
.goalpick .btn{min-width:68px}
.presets,.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rules{margin:0;padding:12px 16px 12px 32px;border:1px dashed var(--line);font-size:15px;color:var(--pencil)}

/* game */
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0 10px;border-bottom:1.5px solid var(--ink)}
.tb-title{display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tb-title .mt{font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.lv{font-size:13px;font-weight:700;border:1.5px solid var(--ink);padding:0 8px;margin-top:3px}
.score{text-align:right;white-space:nowrap}
.score b{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.score span{font-size:16px;margin-left:2px}
.ruler{position:relative;height:28px;border:1.5px solid var(--ink);background:var(--sheet);overflow:hidden}
.ruler i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hl);transition:width .5s}
.ruler.hit i{background:#ffd8d2}
.ruler::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 10%),repeating-linear-gradient(90deg,var(--pencil) 0 1px,transparent 1px 2%);background-size:100% 13px,100% 7px;background-repeat:no-repeat}
.rulerlab{display:flex;justify-content:space-between;font-size:14px;color:var(--pencil);margin-top:4px;font-variant-numeric:tabular-nums}
.rulerlab #stk{color:var(--red);font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.qno{font-family:var(--display);font-weight:700;font-size:24px}
.qno small{font-size:16px;color:var(--pencil)}
.qno .tag{font-family:var(--body);font-size:13px;font-weight:700;color:var(--ink);border:1.5px solid var(--ink);padding:1px 8px;margin-left:10px;vertical-align:middle}
.icon{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;min-height:40px;padding:4px 12px;font-size:15px;font-weight:600}
.icon:hover{background:var(--hl)}
.prompt{font-size:22px;line-height:1.65;margin-top:6px}
.prompt b{color:var(--ink);background:linear-gradient(transparent 60%,var(--hl) 60%)}
.pinote{font-size:15px;color:var(--pencil);white-space:nowrap}
.figbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0}
.fig{width:100%;max-width:380px;height:auto}
.fig .big{font-family:var(--body);font-weight:600;font-size:44px;fill:var(--ink)}
.fig .big.q{fill:var(--red)}
.fig .lbl{font-family:var(--body);font-weight:600;font-size:16px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.fig .or{fill:var(--orange)} .fig .bl{fill:var(--blue)} .fig .vi{fill:var(--violet)} .fig .gd{fill:var(--good)}
.fig .sm{font-family:var(--body);font-size:13px;fill:var(--pencil)}
.sfwrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.sec{transition:transform 1.1s cubic-bezier(.5,0,.2,1);transform-box:view-box;transform-origin:0 0}
.cl,.rl{transition:opacity .5s}
.rl{opacity:0}
.unf .rl{opacity:1}
.unf .cl{opacity:0}
.steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:16px 4px;border-top:1px dashed var(--line)}
.step.cur{background:linear-gradient(90deg,#fffbe0,transparent 70%)}
.step .sn{position:relative;width:32px;height:32px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;margin-top:2px}
.step.done .sn{color:var(--red)}
.step.done .sn::after{content:'';position:absolute;inset:-2px;border:2px solid var(--red);border-radius:50%;transform:rotate(-10deg)}
.sq{font-size:18px;margin-bottom:6px}
.sq b{background:linear-gradient(transparent 60%,var(--hl) 60%)}
.expr{font-size:22px;font-weight:500;line-height:2.4}
.slot{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 5px;line-height:1.2}
.slot input{font-family:var(--body);font-weight:600;font-size:23px;width:4.2em;text-align:center;padding:4px 2px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;color:var(--blue)}
.slot input:focus{outline:none;background:var(--hl)}
.slot input.bad{color:var(--red);background:var(--red-soft);text-decoration:line-through}
.slot input.good{background:var(--blue-soft)}
.slot small{font-size:12.5px;color:var(--pencil);margin-top:3px}
.slot .val{position:relative;display:inline-block;min-width:2.2em;text-align:center;color:var(--blue);font-weight:600;border-bottom:2px solid var(--ink);padding:0 6px}
.slot .val::after,.blank.ok::after,.opt.ok::after,.tok.ok::after{content:'';position:absolute;inset:-5px -7px;border:2px solid var(--red);border-radius:50%;transform:rotate(-4deg);pointer-events:none}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25;margin:0 4px}
.frac>span:first-child{border-bottom:2.5px solid var(--ink);padding:0 4px 3px}
.frac>span:last-child{padding-top:3px}
.frac .slot{margin:2px 0}
.frac .slot input{width:3em;font-size:20px;padding:1px 2px}
.frac .slot .val{border-bottom:0}
.blank{position:relative;display:inline-flex;align-items:flex-end;justify-content:center;min-width:4.6em;min-height:40px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;font-family:var(--body);font-weight:600;font-size:21px;color:var(--blue);padding:0 10px 2px;margin:0 4px;vertical-align:bottom;line-height:1.3}
.blank.active,.blank.hover{background:var(--hl)}
.blank.ok{cursor:default}
.blank.bad{color:var(--red);background:var(--red-soft);text-decoration:line-through;text-decoration-thickness:2px;animation:shake .35s}
.bank{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.chip{font-family:var(--body);font-weight:600;font-size:20px;padding:7px 16px;min-height:48px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;box-shadow:3px 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip:hover{background:var(--hl)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);background:var(--hl)}
.tip{font-size:14px;color:var(--pencil);margin-top:10px}
.opts{display:flex;flex-wrap:wrap;gap:12px}
.opt{position:relative;font-family:var(--body);font-weight:600;font-size:20px;padding:9px 22px;min-height:52px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px}
.opt:hover{background:var(--hl)}
.opt.ok{color:var(--blue);background:var(--sheet)}
.opt.no{color:var(--pencil);cursor:default;background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--red) calc(50% - 1.5px),var(--red) calc(50% + 1.5px),transparent calc(50% + 1.5px)),var(--sheet)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tok{position:relative;font-family:var(--body);font-weight:600;font-size:34px;min-width:66px;min-height:66px;border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet);font-variant-numeric:tabular-nums}
.tok:hover,.tok.sel{background:var(--hl)}
.tok.ok{color:var(--blue);background:var(--sheet)}
.tok.sym{border:0;background:transparent;min-width:22px;cursor:default}
.fb{min-height:1.6em;font-size:18px;margin-top:12px}
.fb.good{font-family:var(--hand);font-size:34px;line-height:1.1;color:var(--red)}
.fb.wrong{color:var(--red)}
.fb.reveal{color:var(--violet)}
.fb.info{color:var(--pencil)}
.donebox{border:1.5px dashed var(--red);padding:12px 16px;margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:18px}
.donebox.zero{border-color:var(--pencil)}
.pts{font-family:var(--hand);font-size:44px;line-height:1;color:var(--red)}
.donebox.zero .pts{color:var(--pencil)}
.bonus{font-family:var(--body);font-size:15px;color:var(--red);margin-left:10px;vertical-align:middle}
.lvmsg{font-weight:700;color:var(--violet)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* concept */
.csent{font-size:21px;line-height:2.5;margin-top:8px}
.example{border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 16px;margin-top:14px}
.example .exl{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--blue);margin-bottom:2px}

/* stamp */
.stamp{width:150px;height:150px;border-radius:50%;border:4px solid var(--red);box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 7px var(--red);color:var(--red);display:grid;place-items:center;text-align:center;font-family:var(--hand);font-size:40px;line-height:.95;transform:rotate(-12deg);margin:0 auto;animation:stampIn .35s ease-out;opacity:.92}
.stamp span{display:block;white-space:nowrap}
.stamp.sm{width:96px;height:96px;font-size:26px;border-width:3px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--red)}
@keyframes stampIn{from{transform:rotate(-12deg) scale(1.9);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.92}}

/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.scorewrap{display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap}
.bigscore{font-family:var(--display);font-weight:700;font-size:84px;line-height:1;font-variant-numeric:tabular-nums}
.bigscore small{font-size:28px;margin-left:4px}
.win{font-size:20px;font-weight:600}
.near{font-size:20px;color:var(--pencil)}
.newbest{font-family:var(--hand);font-size:36px;color:var(--red);line-height:1}
.nextgoal{font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin:0;border:1.5px solid var(--ink)}
.stats div{padding:10px 8px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats dt{font-size:14px;color:var(--pencil)}
.stats dd{margin:0;font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.stats dd small{font-size:16px;color:var(--pencil)}

/* records */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:16px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:700;font-size:14px;color:var(--pencil);border-bottom:1.5px solid var(--ink)}
.tablewrap{overflow-x:auto}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(28,28,28,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:28px 24px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}

@media (max-width:640px){
  h1{font-size:40px} h2{font-size:26px}
  .cover{grid-template-columns:1fr;border-left-width:10px;padding:24px 18px}
  .cover-fig{max-width:200px}
  .grid2{grid-template-columns:1fr}
  .expr{font-size:20px}
  .slot input{width:3.7em;font-size:21px}
  .prompt{font-size:20px}
  .stats dd{font-size:22px}
  .toc .m{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .sec,.cl,.rl,.ruler i{transition:none}
  .shake,.blank.bad,.stamp{animation:none}
}
.danpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dan2{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;min-height:70px;font-family:var(--display);font-weight:700;font-size:28px}
.dan2:hover{background:#fffbe0}
.dan2.on{background:var(--hl);box-shadow:inset 0 0 0 2px var(--ink)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sheet.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chalkcover{border-left-color:#24443a}
.readybox{display:flex;flex-direction:column;gap:14px}
.howto{margin:0;padding-left:1.3em;font-size:18px;line-height:1.7}
.combotable{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--ink)}
.combotable span{padding:8px 10px;text-align:center;font-size:15px}
.combotable span+span{border-left:1px solid var(--line)}
.combotable b{display:block;font-family:var(--display);font-size:22px}
.itemhelp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;font-size:15px}
.itemhelp span{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);padding:6px 10px}
.ic{display:inline-grid;place-items:center;width:22px;height:22px;flex:none}
.ic svg{width:20px;height:20px}
.stats.four{grid-template-columns:repeat(4,1fr)}
.missed{width:100%;text-align:left}
.missed p:last-child{display:flex;flex-wrap:wrap;gap:8px}
.missed span{border:1.5px solid var(--ink);padding:3px 10px;font-size:17px}
.missed span b{color:var(--red)}

/* --- 칠판 게임 화면 --- */
body.playing{overflow:hidden;background:#1d2b25;background-image:none}
.game{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:'board' 'pad';height:var(--vh,100vh);max-width:1240px;margin:0 auto;padding:10px;gap:10px}
.board{grid-area:board;position:relative;display:flex;flex-direction:column;min-height:0;border:12px solid #8a5a33;border-radius:8px;box-shadow:inset 0 0 0 2px #6d4426,0 6px 0 #5a3820;background-color:#2f5446;background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.08),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(255,255,255,.05),transparent 50%);color:#f4f1e8}
.bhud{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:8px 14px 6px;border-bottom:2px dashed rgba(244,241,232,.25)}
.timer{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:end;column-gap:3px;min-width:120px}
.timer .tl{font-family:var(--body);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.timer .tu{font-size:15px;padding-bottom:4px}
.tbar{grid-column:1/-1;height:7px;background:rgba(244,241,232,.18);margin-top:4px;border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:#f4f1e8;width:100%}
.board.hurry .timer .tl{color:#f08b7d;animation:beat 1s infinite}
.board.hurry .tbar i{background:#f08b7d}
@keyframes beat{50%{transform:scale(1.12)}}
.bmid{display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0}
.bt{font-family:var(--hand);font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.combo{font-size:16px;color:#f7e27a;min-height:1.3em;font-variant-numeric:tabular-nums}
.combo b{font-size:22px}
.bscore{text-align:right;line-height:1}
.bscore .sl{display:block;font-size:13px;opacity:.75}
.bscore b{font-family:var(--body);font-size:40px;font-variant-numeric:tabular-nums}
.field{position:relative;flex:1;min-height:180px;overflow:hidden;transition:background .3s}
.field::after{content:'';position:absolute;left:0;right:0;bottom:0;height:86px;border-top:3px solid rgba(244,241,232,.35);background:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.18));pointer-events:none}
.field.frozen{background:rgba(156,201,240,.14)}
.field.starred{box-shadow:inset 0 0 0 4px rgba(247,226,122,.55)}
.prob{position:absolute;left:0;top:0;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;font-family:var(--body);font-weight:700;font-size:30px;color:#f4f1e8;white-space:nowrap;will-change:transform;line-height:1.2;border-bottom:2px solid rgba(244,241,232,.35);text-shadow:0 0 1px rgba(255,255,255,.6)}
.field.frozen .prob{color:#9cc9f0}
.prob.item{color:#f7e27a;border:2px dashed #f7e27a;border-radius:6px}
.prob.item .ic{color:#f7e27a}
.prob.pop{animation:ppop .4s forwards}
.prob.pop::after{content:'';position:absolute;inset:-6px -8px;border:3px solid #f08b7d;border-radius:50%}
.prob.dust{animation:dust .42s forwards;color:#f08b7d}
@keyframes ppop{to{opacity:0;filter:blur(2px)}}
@keyframes dust{to{opacity:0;letter-spacing:.3em;filter:blur(3px)}}
.pt{position:absolute;left:0;top:0;z-index:4;font-family:var(--hand);font-size:38px;color:#f7e27a;pointer-events:none;animation:rise .8s forwards}
@keyframes rise{to{margin-top:-44px;opacity:0}}
.kid{position:absolute;left:50%;bottom:6px;width:58px;height:78px;margin-left:-29px;z-index:2}
.kid svg{width:100%;height:100%}
.kid.jump{animation:jump .4s}
.kid.oops{animation:oops .4s}
@keyframes jump{40%{transform:translateY(-22px)}}
@keyframes oops{25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
.bubble{position:absolute;bottom:84px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;white-space:nowrap;background:#f4f1e8;color:#24443a;font-family:var(--hand);font-size:28px;padding:2px 14px;border-radius:14px;transition:all .15s}
.bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
.fxchips{position:absolute;top:8px;right:10px;z-index:5;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.fxchips span{background:#f4f1e8;color:#24443a;font-size:14px;font-weight:700;padding:3px 10px;border-radius:3px}
.flash{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:6;font-family:var(--hand);font-size:40px;color:#f7e27a;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;white-space:nowrap}
.flash.on{opacity:1}
.flash.bad{color:#f08b7d;font-size:32px}
.tray{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-top:2px solid #6d4426;background:#7a4e2c}
.slots{display:flex;gap:8px}
.slot{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:78px;white-space:nowrap;height:50px;border:2px dashed rgba(244,241,232,.35);border-radius:6px;font-size:12px;font-weight:700;color:#24443a;line-height:1.1}
.slot.full{border:2px solid #f4f1e8;background:#f7e27a;cursor:pointer}
.slot.full.diamond{background:#bfe3f7}.slot.full.bomb{background:#f4c3bb}
.slot.full:hover{filter:brightness(1.05)}
.slot small{position:absolute;top:1px;right:4px;font-size:11px}
.trayr{display:flex;gap:8px}
.cbtn{border:2px solid #f4f1e8;background:transparent;color:#f4f1e8;font-weight:700;font-size:15px;padding:6px 14px;min-height:42px;border-radius:5px}
.cbtn:hover{background:rgba(244,241,232,.12)}
.pad{grid-area:pad;display:flex;flex-direction:column;gap:8px;min-height:0}
.inrow{display:flex;gap:8px}
.ti{flex:1;min-height:62px;display:flex;align-items:center;padding:0 18px;font-family:var(--body);font-weight:700;font-size:38px;color:#1d2b25;border:3px solid #f4f1e8;border-radius:6px;background:#fffdf5;font-variant-numeric:tabular-nums}
.ti.empty::before{content:'답을 쳐요 (키보드 숫자 또는 숫자 버튼)';font-size:18px;font-weight:600;color:#9b958a}
.ti.bad{border-color:#f08b7d;animation:shake .3s}
.kok2{min-width:96px;font-size:20px;background:#f7e27a;color:#1d2b25;border-color:#f7e27a;box-shadow:none}
.kok2:hover{background:#ffe95c}
.padtg{background:transparent;color:#f4f1e8;border-color:#f4f1e8;font-size:15px}
.keys{display:none;grid-template-columns:repeat(3,1fr);gap:6px}
.game.withpad .keys{display:grid}
.keys button{font-family:var(--body);font-weight:700;font-size:28px;min-height:54px;border:2px solid #f4f1e8;border-radius:6px;background:#36604f;color:#f4f1e8;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.keys button:active{background:#f7e27a;color:#1d2b25}
.keys .kfn{font-size:17px}
.keys .kok{background:#f7e27a;color:#1d2b25;font-size:20px}
@media (min-width:900px) and (orientation:landscape){
  .game.withpad{grid-template-columns:minmax(0,1fr) 290px;grid-template-rows:minmax(0,1fr);grid-template-areas:'board pad'}
  .game.withpad .inrow{flex-wrap:wrap}
  .game.withpad .ti{flex-basis:100%}
  .game.withpad .kok2{flex:1}
  .game.withpad .keys{flex:1;grid-auto-rows:1fr}
}
@media (max-width:640px){
  .prob{font-size:24px}
  .timer .tl,.bscore b{font-size:30px}
  .slot{width:54px;height:44px}
  .sheet.two{grid-template-columns:1fr}
  .combotable{grid-template-columns:1fr 1fr}
  .stats.four{grid-template-columns:1fr 1fr}
  .ti{font-size:30px}
  .ti.empty::before{content:'답을 쳐요'}
}
@media (prefers-reduced-motion:reduce){.prob.pop,.prob.dust,.pt,.kid,.board.hurry .timer .tl{animation:none}.prob.pop,.prob.dust,.pt{opacity:0}}
</style>
</head>
<body>
<main id="app"></main>
<noscript><p style="padding:20px">이 게임은 자바스크립트가 켜져 있어야 해요.</p></noscript>
<script>
/* ================= 구구단 타자 연습 (시간제 점수) ================= */
const QP = new URLSearchParams(location.search), EMBED = QP.get('embed') === '1';
const post = m => { try { parent.postMessage(Object.assign({ src: 'lp-game' }, m), '*'); } catch (e) {} };
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'gtype.v1' + (EMBED ? '.' + (QP.get('sid') || '') : '');
function load() { try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.best) return j; } catch (e) {} return { best: {}, sound: true, dans: [2], level: 1, time: 60, pad: null }; }
let D = load(), G = null;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} };
const touch = matchMedia('(pointer: coarse)').matches;
if (D.pad == null) D.pad = touch;

/* ---------- 구구단 ---------- */
const DANS = [2, 3, 4, 5, 6, 7, 8, 9];
function dansOf(mode) { const m = String(mode || '').replace('gugu-', ''); if (m === 'all') return DANS; const d = [...new Set(m.split('').map(Number).filter(x => x >= 2 && x <= 9))].sort((a, b) => a - b); return d.length ? d : [2]; }
const modeOf = d => 'gugu-' + (d.length === 8 ? 'all' : d.join(''));
const titleOf = d => d.length === 8 ? '2~9단 섞어서' : d.map(a => a + '단').join('·');
const poolOf = d => d.flatMap(a => [1, 2, 3, 4, 5, 6, 7, 8, 9].map(b => ({ show: `${a} × ${b}`, ans: String(a * b), a, b })));
const bestKey = (mode, t) => mode + '/' + t;

/* ---------- 아이템 ---------- */
const ITEMS = {
  bomb: { name: '폭탄', desc: '떨어지는 문제를 모두 맞혀요' },
  diamond: { name: '다이아몬드', desc: '콤보 +5' },
  clock: { name: '시계', desc: '시간 +5초' },
  ice: { name: '얼음', desc: '5초 동안 문제가 멈춰요' },
  star: { name: '별', desc: '10초 동안 점수 2배' }
};
const ICON = {
  bomb: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="14" r="7"/><path d="M14 8l3-3M17 5c1-1 2.5-1 3 .5M19 2v1.5M22 5h-1.5"/></g></svg>',
  diamond: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3l3 18 3-18"/></g></svg>',
  clock: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></g></svg>',
  ice: '<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10"/><path d="M9 4l3 2 3-2M9 20l3-2 3 2"/></g></svg>',
  star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.1l1.5-7L2 9.3l7-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'
};
const LEVELS = { 1: { fall: 12, gap: 2.6, max: 4, name: '1 느리게' }, 2: { fall: 9, gap: 1.9, max: 6, name: '2 보통' }, 3: { fall: 6.5, gap: 1.3, max: 8, name: '3 빠르게' } };
const TIMES = [60, 90, 120];
const mult = c => c >= 20 ? 4 : c >= 10 ? 3 : c >= 5 ? 2 : 1;

/* ---------- 소리 ---------- */
let AC = null;
function tone(fs, dur = .09, vol = .16) { if (!D.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime; fs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; const st = t + i * dur; g.gain.setValueAtTime(.0001, st); g.gain.exponentialRampToValueAtTime(vol, st + .015); g.gain.exponentialRampToValueAtTime(.0001, st + dur); o.connect(g).connect(AC.destination); o.start(st); o.stop(st + dur + .03); }); } catch (e) {} }
const sHit = c => tone([600 + Math.min(c, 20) * 25, 900 + Math.min(c, 20) * 25], .06), sMiss = () => tone([240, 180], .12), sWrong = () => tone([190], .08), sItem = () => tone([520, 780, 1040], .07), sEnd = () => tone([784, 659, 523, 784, 1046], .12), sTick = () => tone([1200], .04, .08);

/* ---------- 화면 공통 ---------- */
const app = $('#app');
const setScreen = (html, playing) => { document.body.classList.toggle('playing', !!playing); app.innerHTML = html; window.scrollTo(0, 0); };
function setVH() { document.documentElement.style.setProperty('--vh', (window.visualViewport ? visualViewport.height : innerHeight) + 'px'); if (G && G.running) measure(); }
(window.visualViewport || window).addEventListener('resize', setVH); setVH();
const kidSVG = `<svg viewBox="0 0 60 80" aria-hidden="true"><g fill="none" stroke="#f4f1e8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="18" r="12"/><path d="M24 17h.1M36 17h.1" stroke-width="4"/><path d="M25 23q5 4 10 0"/><path d="M30 30v24M30 38l-12-6M30 38l12-6M30 54l-9 18M30 54l9 18"/></g></svg>`;

/* ---------- 처음 화면 (따로 열었을 때) ---------- */
function home() {
  let sel = D.dans && D.dans.length ? D.dans : [2];
  const draw = () => {
    const mode = modeOf(sel), best = D.best[bestKey(mode, D.time)] || 0;
    setScreen(`<div class="wrap">
    <header class="cover chalkcover"><div class="cover-main"><p class="kicker">곱셈구구 타자</p><h1>구구단 타자 연습</h1><p class="sub">떨어지는 곱셈의 답을 쳐서 없애요. 정해진 시간 안에 콤보를 이어 가며 높은 점수를 노려요.</p></div><div class="cover-fig">${coverSVG()}</div></header>
    <section class="sheet"><p class="label">몇 단을 할까요? (여러 개 골라도 돼요)</p>
      <div class="danpick">${DANS.map(a => `<button class="dan2 ${sel.includes(a) ? 'on' : ''}" type="button" data-d="${a}" aria-pressed="${sel.includes(a)}">${a}단</button>`).join('')}</div>
      <div class="presets"><button class="pill" type="button" data-p="25">2·5단</button><button class="pill" type="button" data-p="34">3·4단</button><button class="pill" type="button" data-p="67">6·7단</button><button class="pill" type="button" data-p="89">8·9단</button><button class="pill" type="button" data-p="23456789">모두 섞기</button></div></section>
    <section class="sheet two"><div><p class="label">빠르기</p><div class="presets">${[1, 2, 3].map(v => `<button class="pill ${v === D.level ? 'on' : ''}" type="button" data-lv="${v}">${LEVELS[v].name}</button>`).join('')}</div></div>
      <div><p class="label">시간</p><div class="presets">${TIMES.map(t => `<button class="pill ${t === D.time ? 'on' : ''}" type="button" data-tm="${t}">${t / 60 === Math.floor(t / 60) ? t / 60 + '분' : t + '초'}</button>`).join('')}</div></div></section>
    <button class="btn big blue" type="button" id="go">${titleOf(sel)} 시작하기${best ? ` · 최고 ${best}점` : ''}</button>
    <footer class="foot"><button class="textbtn" type="button" id="snd">소리 ${D.sound ? '켜짐' : '꺼짐'}</button></footer></div>`);
    $$('[data-d]').forEach(b => b.onclick = () => { const a = +b.dataset.d; sel = sel.includes(a) ? sel.filter(x => x !== a) : [...sel, a].sort((x, y) => x - y); if (!sel.length) sel = [a]; D.dans = sel; save(); draw(); });
    $$('[data-p]').forEach(b => b.onclick = () => { sel = b.dataset.p.split('').map(Number); D.dans = sel; save(); draw(); });
    $$('[data-lv]').forEach(b => b.onclick = () => { D.level = +b.dataset.lv; save(); draw(); });
    $$('[data-tm]').forEach(b => b.onclick = () => { D.time = +b.dataset.tm; save(); draw(); });
    $('#go').onclick = () => ready({ mode, level: D.level, time: D.time });
    $('#snd').onclick = () => { D.sound = !D.sound; save(); draw(); };
  };
  draw();
}
function coverSVG() { return `<svg viewBox="0 0 220 170" aria-hidden="true"><rect x="4" y="4" width="212" height="162" rx="6" fill="#24443a" stroke="#8a5a33" stroke-width="8"/><g font-family="var(--body)" font-weight="700" font-size="19" fill="#f4f1e8"><text x="26" y="52">2 × 6</text><text x="118" y="40" fill="#f7e27a">5 × 3</text><text x="124" y="92">3 × 4</text></g><text x="20" y="96" font-family="var(--hand)" font-size="24" fill="#f08b7d">콤보 12!</text><g transform="translate(86 104) scale(.62)">${kidSVG.replace('<svg viewBox="0 0 60 80" aria-hidden="true">', '').replace('</svg>', '')}</g></svg>`; }

/* ---------- 준비 화면 ---------- */
function ready(cfg) {
  const dans = dansOf(cfg.mode); cfg.mode = modeOf(dans); cfg.pool = poolOf(dans); cfg.title = titleOf(dans);
  const best = D.best[bestKey(cfg.mode, cfg.time)] || 0;
  setScreen(`<div class="wrap">
  ${EMBED ? '' : '<button class="btn ghost sm back" type="button" id="bk">← 단 고르기</button>'}
  <article class="sheet readybox"><p class="label">구구단 타자 연습</p><h2>${esc(cfg.title)}</h2>
    <p class="small">${LEVELS[cfg.level].name} · ${cfg.time}초${best ? ` · 내 최고 ${best}점` : ''}</p>
    <ol class="howto"><li>위에서 <b>3 × 4</b> 같은 곱셈이 떨어져요. <b>답</b>을 키보드나 숫자 버튼으로 치고 <b>Enter</b>(쓰기)를 눌러요.</li>
      <li><b>${cfg.time}초</b> 동안 점수를 최대한 많이 모아요.</li>
      <li>연속으로 맞히면 <b>콤보</b>가 쌓여요. 틀리거나 문제가 바닥에 닿으면 콤보가 0이 돼요.</li>
      <li><span class="hl">노란 문제</span>를 맞히면 아이템을 얻어요. 아이템 칸을 누르거나 <b>↑</b> 키로 써요.</li></ol>
    <div class="combotable"><span>콤보 1~4 <b>10점</b></span><span>콤보 5~9 <b>20점</b></span><span>콤보 10~19 <b>30점</b></span><span>콤보 20 이상 <b>40점</b></span></div>
    <div class="itemhelp">${Object.entries(ITEMS).map(([k, v]) => `<span><i class="ic">${ICON[k]}</i><b>${v.name}</b> ${v.desc}</span>`).join('')}</div>
    <button class="btn big blue" type="button" id="go">시작하기</button></article></div>`);
  if ($('#bk')) $('#bk').onclick = home;
  $('#go').onclick = () => play(cfg);
}

/* ---------- 게임 ---------- */
const FLOOR = 86;
function play(cfg) {
  const L = LEVELS[cfg.level] || LEVELS[1];
  G = { cfg, score: 0, cleared: 0, wrong: 0, missedN: 0, combo: 0, maxCombo: 0, left: cfg.time, total: cfg.time, items: [], words: [], missed: [], fall: L.fall, gap: L.gap, max: L.max, t: 0, next: .3, last: 0, running: true, paused: false, fx: { ice: 0, star: 0 }, recent: [], uid: 0, input: '', speedUps: 0, tickAt: 11 };
  setScreen(`<div class="game ${D.pad ? 'withpad' : ''}" id="game">
    <div class="board" id="board">
      <div class="bhud">
        <div class="timer"><span class="tl" id="tl">${cfg.time}</span><span class="tu">초</span><div class="tbar"><i id="tb"></i></div></div>
        <div class="bmid"><span class="bt">${esc(cfg.title)}</span><span class="combo" id="cb"></span></div>
        <div class="bscore"><span class="sl">점수</span><b id="sc">0</b></div>
      </div>
      <div class="field" id="field"><div class="fxchips" id="fxc"></div><div class="flash" id="flash" aria-live="polite"></div><div class="kid" id="kid">${kidSVG}<span class="bubble" id="bub"></span></div></div>
      <div class="tray"><div class="slots" id="slots" aria-label="아이템 칸"></div><div class="trayr"><button class="cbtn" type="button" id="pz">멈춤</button><button class="cbtn" type="button" id="quit">그만하기</button></div></div>
    </div>
    <div class="pad" id="pad">
      <div class="inrow"><div class="ti empty" id="ti" role="textbox" aria-label="답 쓰는 칸" aria-live="polite"></div><button class="btn kok2" type="button" data-k="ok">쓰기</button><button class="btn ghost padtg" type="button" id="padtg" aria-pressed="${D.pad}">${D.pad ? '숫자 버튼 숨기기' : '숫자 버튼'}</button></div>
      <div class="keys" id="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="del" class="kfn">지우기</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="kok">쓰기</button></div>
    </div></div>`, true);
  measure(); renderSlots(); updateHud();
  $$('#pad [data-k]').forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => press(b.dataset.k); });
  $('#padtg').onclick = () => { D.pad = !D.pad; save(); $('#game').classList.toggle('withpad', D.pad); $('#padtg').textContent = D.pad ? '숫자 버튼 숨기기' : '숫자 버튼'; $('#padtg').setAttribute('aria-pressed', D.pad); setTimeout(measure, 50); };
  $('#quit').onclick = () => end(false);
  $('#pz').onclick = () => pause(true);
  G.last = performance.now(); G.raf = requestAnimationFrame(loop);
}
function measure() { const f = $('#field'); if (!f || !G) return; G.W = f.clientWidth; G.H = f.clientHeight; }
function showInput() { const ti = $('#ti'); if (ti) { ti.textContent = G.input; ti.classList.toggle('empty', !G.input); } }
function press(k) { if (!G || !G.running || G.paused) return; if (k === 'ok') return submit(); if (k === 'del') G.input = G.input.slice(0, -1); else if (G.input.length < 3) G.input += k; $('#ti').classList.remove('bad'); showInput(); }
document.addEventListener('keydown', e => {
  if (!G || !G.running) return;
  if (G.paused) { if (e.key === 'Enter') { e.preventDefault(); pause(false); } return; }
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press('ok'); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); useItem(0); }
  else if (e.key === 'Escape') { e.preventDefault(); pause(true); }
});
function loop(ts) {
  if (!G || !G.running) return;
  const dt = Math.min(.05, (ts - G.last) / 1000); G.last = ts;
  if (!G.paused) { G.t += dt; update(dt); }
  if (!G || !G.running) return;
  G.raf = requestAnimationFrame(loop);
}
function update(dt) {
  G.left -= dt;
  if (G.left <= 0) { G.left = 0; updateHud(); end(true); return; }
  if (G.left < G.tickAt && G.left > 0) { G.tickAt = Math.floor(G.left); sTick(); }
  const elapsed = G.total - G.left; if (elapsed > (G.speedUps + 1) * 20) { G.speedUps++; G.fall = Math.max(4, G.fall * .88); G.gap = Math.max(.8, G.gap * .88); G.max = Math.min(10, G.max + 1); flash('조금 빨라져요!'); }
  const now = G.t, frozen = now < G.fx.ice, floor = G.H - FLOOR;
  if (!frozen) {
    const v = (floor + 40) / G.fall;
    for (const w of [...G.words]) { w.y += v * dt; w.el.style.transform = `translate(${w.x}px,${w.y}px)`; if (w.y + w.h >= floor) miss(w); }
    if (now >= G.next && G.words.length < G.max) { spawn(); G.next = now + G.gap * (.75 + Math.random() * .5); }
  }
  const f = $('#field'); f.classList.toggle('frozen', frozen); f.classList.toggle('starred', now < G.fx.star);
  const chips = []; if (frozen) chips.push(`얼음 ${Math.ceil(G.fx.ice - now)}초`); if (now < G.fx.star) chips.push(`별 점수 2배 ${Math.ceil(G.fx.star - now)}초`);
  const fx = $('#fxc'), html = chips.map(c => `<span>${c}</span>`).join(''); if (fx.innerHTML !== html) fx.innerHTML = html;
  updateTimer();
}
function spawn() {
  const on = new Set(G.words.map(w => w.ans));
  let cand = G.cfg.pool.filter(w => !on.has(w.ans) && !G.recent.includes(w.show)); if (!cand.length) cand = G.cfg.pool.filter(w => !on.has(w.ans)); if (!cand.length) return;
  const src = pick(cand); G.recent.push(src.show); if (G.recent.length > Math.min(6, Math.floor(G.cfg.pool.length / 2))) G.recent.shift();
  let item = null; if (Math.random() < .14) { const r = Math.random(); item = r < .22 ? 'bomb' : r < .47 ? 'diamond' : r < .65 ? 'clock' : r < .82 ? 'ice' : 'star'; }
  const el = document.createElement('div'); el.className = 'prob' + (item ? ' item' : '');
  el.innerHTML = (item ? `<i class="ic">${ICON[item]}</i>` : '') + `<span>${esc(src.show)}</span>`;
  $('#field').appendChild(el);
  const w = { id: ++G.uid, show: src.show, ans: src.ans, item, el, w: el.offsetWidth, h: el.offsetHeight, y: -44 };
  let best = null; for (let i = 0; i < 8; i++) { const x = 10 + Math.random() * Math.max(1, G.W - w.w - 20); if (!G.words.some(o => o.y < 90 && Math.abs(o.x - x) < Math.max(o.w, w.w) + 8)) { best = x; break; } best = best ?? x; }
  w.x = best; el.style.transform = `translate(${w.x}px,${w.y}px)`; G.words.push(w);
}
function removeWord(w, cls) { G.words = G.words.filter(o => o !== w); w.el.classList.add(cls); setTimeout(() => w.el.remove(), 420); }
function miss(w) { removeWord(w, 'dust'); G.missed.push(w); G.missedN++; if (G.combo >= 5) flash(`콤보 ${G.combo}에서 끊겼어요`, true); G.combo = 0; sMiss(); kid('oops'); updateHud(); }
function submit() {
  if (!G || !G.running || G.paused) return; const v = G.input; G.input = ''; showInput(); if (!v) return;
  const c = G.words.filter(w => w.ans === v);
  if (!c.length) { G.wrong++; if (G.combo >= 5) flash(`콤보 ${G.combo}에서 끊겼어요`, true); else flash(`${esc(v)}은(는) 답이 아니에요`, true); G.combo = 0; sWrong(); const ti = $('#ti'); ti.classList.remove('bad'); void ti.offsetWidth; ti.classList.add('bad'); kid('oops'); updateHud(); return; }
  hit(c.reduce((a, b) => b.y > a.y ? b : a));
}
function hit(w) {
  removeWord(w, 'pop'); G.cleared++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  const star = G.t < G.fx.star, pts = 10 * mult(G.combo) * (star ? 2 : 1); G.score += pts; floatPts(w, pts);
  if (w.item) { if (G.items.length < 3) { G.items.push(w.item); sItem(); flash(`${ITEMS[w.item].name}을(를) 얻었어요`); renderSlots(); } else { G.score += 10; flash('아이템 칸이 꽉 찼어요 +10'); } }
  sHit(G.combo); kid('jump');
  if ([5, 10, 20, 30, 40, 50].includes(G.combo)) { bubble(`콤보 ${G.combo}!`); if (G.combo === 5 || G.combo === 10 || G.combo === 20) flash(`콤보 ${G.combo}! 이제 한 문제에 ${10 * mult(G.combo)}점`); }
  updateHud();
}
function floatPts(w, pts) { const p = document.createElement('div'); p.className = 'pt'; p.textContent = '+' + pts; p.style.transform = `translate(${w.x + w.w / 2 - 14}px,${w.y}px)`; $('#field').appendChild(p); setTimeout(() => p.remove(), 800); }
let flashT = null, bubT = null, kidT = null;
function flash(msg, bad) { const f = $('#flash'); if (!f) return; f.className = 'flash on' + (bad ? ' bad' : ''); f.innerHTML = msg; clearTimeout(flashT); flashT = setTimeout(() => { if ($('#flash')) $('#flash').className = 'flash'; }, 1300); }
function bubble(msg) { const b = $('#bub'); if (!b) return; b.textContent = msg; b.classList.add('on'); clearTimeout(bubT); bubT = setTimeout(() => { if ($('#bub')) $('#bub').classList.remove('on'); }, 1200); }
function kid(cls) { const k = $('#kid'); if (!k) return; k.classList.remove('jump', 'oops'); void k.offsetWidth; k.classList.add(cls); clearTimeout(kidT); kidT = setTimeout(() => { if ($('#kid')) $('#kid').classList.remove(cls); }, 420); }
function useItem(i) {
  if (!G || !G.running || G.paused) return; const k = G.items[i]; if (!k) return; G.items.splice(i, 1); sItem();
  if (k === 'bomb') { const list = [...G.words]; if (!list.length) flash('폭탄! 그런데 문제가 없었어요'); else { list.forEach(w => hit(w)); flash(`폭탄! ${list.length}문제를 한꺼번에 맞혔어요`); } }
  if (k === 'diamond') { G.combo += 5; G.maxCombo = Math.max(G.maxCombo, G.combo); bubble(`콤보 ${G.combo}!`); flash(`다이아몬드! 콤보 +5 → ${G.combo}`); }
  if (k === 'clock') { G.left += 5; G.total += 5; G.tickAt = Math.max(G.tickAt, Math.min(11, Math.floor(G.left))); flash('시계! 시간 +5초'); }
  if (k === 'ice') { G.fx.ice = G.t + 5; flash('얼음! 5초 동안 멈춰요'); }
  if (k === 'star') { G.fx.star = G.t + 10; flash('별! 10초 동안 점수 2배'); }
  renderSlots(); updateHud();
}
function renderSlots() { const s = $('#slots'); if (!s) return; s.innerHTML = [0, 1, 2].map(i => { const k = G.items[i]; return k ? `<button class="slot full ${k}" type="button" data-i="${i}" title="${ITEMS[k].desc}"><i class="ic">${ICON[k]}</i><span>${ITEMS[k].name}</span>${i === 0 ? '<small>↑</small>' : ''}</button>` : '<span class="slot" aria-hidden="true"></span>'; }).join(''); $$('[data-i]', s).forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => useItem(+b.dataset.i); }); }
function updateTimer() { const tl = $('#tl'); if (!tl) return; const s = Math.ceil(G.left); if (tl.textContent !== String(s)) tl.textContent = s; $('#tb').style.width = Math.max(0, G.left / G.total * 100) + '%'; $('#board').classList.toggle('hurry', G.left <= 10); }
function updateHud() { if (!$('#sc')) return; $('#sc').textContent = G.score; const m = mult(G.combo); $('#cb').innerHTML = G.combo ? `콤보 <b>${G.combo}</b>${m > 1 ? ` · 한 문제 ${10 * m}점` : ''}` : ''; updateTimer(); }
function pause(on) {
  if (!G || !G.running) return; G.paused = on; const old = $('.overlay'); if (old) old.remove();
  if (on) { const ov = document.createElement('div'); ov.className = 'overlay'; ov.innerHTML = `<div class="modal"><h2>잠깐 멈췄어요</h2><p>남은 시간 ${Math.ceil(G.left)}초 · 지금 ${G.score}점</p><button class="btn big blue" type="button" id="resume">계속하기</button><button class="btn ghost" type="button" id="stop">그만하기</button></div>`; document.body.appendChild(ov); $('#resume').onclick = () => pause(false); $('#stop').onclick = () => { ov.remove(); end(false); }; $('#resume').focus(); }
  else G.last = performance.now();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.running && !G.paused) pause(true); });
window.addEventListener('message', e => { if (e.source !== parent) return; const m = e.data; if (m && m.src === 'lp-host' && m.type === 'end' && G && G.running) end(false); });
function end(finished) {
  if (!G || !G.running) return; G.running = false; cancelAnimationFrame(G.raf); const ov = $('.overlay'); if (ov) ov.remove();
  const g = G, cfg = g.cfg, k = bestKey(cfg.mode, cfg.time), prev = D.best[k] || 0, newBest = finished && g.score > prev;
  if (finished) { D.best[k] = Math.max(prev, g.score); save(); sEnd(); }
  if (EMBED) post({ type: 'session', mode: cfg.mode, score: g.score, combo: g.maxCombo, time: cfg.time, achieved: finished, solved: g.cleared, first: g.cleared, level: cfg.level });
  const tried = g.cleared + g.wrong + g.missedN, acc = tried ? Math.round(g.cleared / tried * 100) : 0;
  const seen = new Set(), missed = g.missed.filter(m => !seen.has(m.show) && seen.add(m.show));
  setScreen(`<div class="wrap"><article class="sheet result">
    <p class="label">${esc(cfg.title)} · ${LEVELS[cfg.level].name} · ${cfg.time}초</p>
    <div class="scorewrap"><div class="bigscore">${g.score}<small>점</small></div>${finished && g.score >= 100 ? '<div class="stamp sm" aria-label="참 잘했어요 도장"><span>참<br>잘했어요</span></div>' : ''}</div>
    <p class="${finished ? 'win' : 'near'}">${finished ? '시간 끝! 끝까지 잘했어요.' : '중간에 그만뒀어요. 끝까지 해야 기록이 남아요.'}</p>
    ${newBest ? '<p class="newbest">새 최고 기록!</p>' : finished && prev ? `<p class="small">내 최고 기록 ${prev}점</p>` : ''}
    <dl class="stats four"><div><dt>맞힌 문제</dt><dd>${g.cleared}</dd></div><div><dt>최대 콤보</dt><dd>${g.maxCombo}</dd></div><div><dt>정확도</dt><dd>${acc}<small>%</small></dd></div><div><dt>놓친 문제</dt><dd>${g.missedN}</dd></div></dl>
    ${missed.length ? `<div class="missed"><p class="label">놓친 곱셈 · 소리 내어 한 번 더 외워 봐요</p><p>${missed.slice(0, 18).map(m => `<span>${esc(m.show)} = <b>${esc(m.ans)}</b></span>`).join('')}</p></div>` : ''}
    <div class="actions" style="justify-content:center"><button class="btn ghost" type="button" id="back">${EMBED ? '과제 목록으로' : '단 고르기'}</button><button class="btn blue" type="button" id="again">다시 하기</button></div>
  </article></div>`);
  $('#back').onclick = () => EMBED ? post({ type: 'close' }) : home();
  $('#again').onclick = () => ready(cfg);
  G = null;
}

/* ---------- 시작 ---------- */
if (EMBED) ready({ mode: QP.get('mode') || 'gugu-2', level: Math.min(3, Math.max(1, +QP.get('level') || 1)), time: [60, 90, 120, 180].includes(+QP.get('time')) ? +QP.get('time') : 60 });
else home();
</script>
