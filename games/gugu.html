<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구구단 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  /* 연습장 한 권: 줄 노트 바탕 + 검정 인쇄 + 파란 펜(학생 답) + 빨간 펜(채점) + 형광펜(지금 할 곳) */
  --paper:#f3f3ef; --sheet:#ffffff; --rule:#dfe5ec; --line:#d3d0c8;
  --ink:#1c1c1c; --pencil:#625f58;
  --blue:#1d4b97; --blue-soft:#e8eef8;
  --red:#cc2f26; --red-soft:#fcebe9;
  --hl:#fff09a;
  --orange:#d7802a; --violet:#5a4aa6; --good:#2c7a49;
  --circleFill:#eef3f9;
  --display:'Gowun Batang','Nanum Myeongjo',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hand:'Nanum Pen Script','Gowun Batang',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--paper);background-image:linear-gradient(transparent 31px,var(--rule) 32px);background-size:100% 32px;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:50px;letter-spacing:-.01em}
h2{font-size:30px}
h3{font-size:21px}
p{margin:0}
b{font-weight:700}
.small{font-size:15px;color:var(--pencil)}
.red{color:var(--red)}
.hl{background:var(--hl);padding:0 4px;font-weight:700;color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 72px;display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:22px}
.label{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:700;letter-spacing:.06em;padding:2px 9px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{font-family:var(--body);font-weight:700;font-size:18px;background:var(--ink);color:#fff;border:1.5px solid var(--ink);border-radius:5px;padding:10px 20px;min-height:50px}
.btn:hover{background:#000}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--sheet);color:var(--ink)}
.btn.ghost:hover{background:var(--hl)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{font-size:15px;min-height:40px;padding:5px 14px}
.btn.big{font-size:20px;min-height:58px;width:100%}
.textbtn{background:none;border:0;padding:4px 2px;font-size:15px;color:var(--pencil);text-decoration:underline;text-underline-offset:3px}
.pill{font-weight:600;font-size:16px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;padding:5px 14px;min-height:42px;font-variant-numeric:tabular-nums}
.pill:hover{background:var(--hl)}
.pill.on{background:var(--ink);color:#fff}
.pill.hot{border-style:dashed}
.back{align-self:flex-start}
.warn{color:var(--red);font-weight:700;margin-top:10px}

/* cover */
.cover{background:var(--sheet);border:1.5px solid var(--ink);border-left:14px solid var(--ink);display:grid;grid-template-columns:1fr 230px;gap:20px;padding:30px 28px;align-items:center}
.kicker{font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--pencil)}
.cover .sub{font-family:var(--display);font-size:20px;color:var(--pencil);margin-top:4px}
.nameplate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;border:1.5px solid var(--ink);padding:10px 14px;max-width:420px}
.nameplate label{font-family:var(--display);font-weight:700;font-size:20px}
.nameplate input{flex:1;min-width:8em;font-family:var(--body);font-weight:600;font-size:22px;color:var(--blue);border:0;border-bottom:2px solid var(--ink);background:transparent;padding:4px 2px;border-radius:0}
.nameplate input:focus{outline:none;background:var(--hl)}
.names{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.names .small{margin-right:4px}
.tally{margin-top:14px;font-size:16px;color:var(--pencil)}
.tally b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
.cover-fig svg{width:100%;height:auto}
.cf{font-family:var(--body);font-weight:600;font-size:15px;fill:var(--blue)}
.cf.big{font-size:24px;fill:var(--ink)}
.sec-h{font-size:24px;margin-bottom:6px}
.toc{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.toc li{border-bottom:1px solid var(--line)}
.toc button{display:grid;grid-template-columns:2.2em 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:16px 6px}
.toc .no{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.toc .t{display:block;font-family:var(--display);font-weight:700;font-size:22px}
.toc .d{display:block;font-size:15px;color:var(--pencil);margin-top:2px}
.toc .m{font-size:14px;color:var(--pencil);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.toc button:hover .t{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.toc button:hover{background:#fcfcf8}
.foot{display:flex;gap:10px;justify-content:center;align-items:center;color:var(--pencil)}

/* unit */
.chap{display:flex;gap:16px;align-items:center}
.chap-no{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;border-right:1.5px solid var(--ink);padding-right:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.c1{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.cdots{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.cdots span{width:18px;height:18px;border:1.5px solid var(--ink);background:var(--sheet)}
.cdots span.d{background:var(--ink)}
.cdots span.c{background:var(--hl)}
.keybox{background:var(--sheet);border:1.5px solid var(--ink)}
.keybox h3{background:var(--ink);color:#fff;font-family:var(--body);font-size:15px;letter-spacing:.04em;padding:7px 14px}
.flist{list-style:none;margin:0;padding:8px 16px 12px;display:flex;flex-direction:column}
.flist li{display:grid;grid-template-columns:7.5em 1fr;gap:12px;align-items:baseline;border-bottom:1px dashed var(--line);padding:7px 0}
.flist li:last-child{border-bottom:0}
.flist b{font-size:16px}
.flist span{font-size:17px}
.keybox.big .flist span{font-size:19px}

/* goal */
.goal{display:flex;flex-direction:column;gap:22px}
.mybest{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.mybest .v{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.mybest .v small{font-size:18px;margin-left:2px}
.spark{display:flex;align-items:flex-end;gap:6px;height:76px;padding:20px 4px 0;border-bottom:1.5px solid var(--ink);flex:1;min-width:200px}
.spark div{flex:1;max-width:28px;background:var(--sheet);border:1.5px solid var(--ink);border-bottom:0;position:relative}
.spark div.ok{background:var(--blue-soft);border-color:var(--blue)}
.spark div span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--pencil);font-variant-numeric:tabular-nums}
.goalpick{display:flex;align-items:center;gap:16px;justify-content:center;margin:4px 0 12px}
.goalpick output{font-family:var(--display);font-weight:700;font-size:60px;min-width:2.8em;text-align:center;font-variant-numeric:tabular-nums;border-bottom:2px solid var(--ink);line-height:1.15}
.goalpick output small{font-size:22px;margin-left:2px}
.goalpick .btn{min-width:68px}
.presets,.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rules{margin:0;padding:12px 16px 12px 32px;border:1px dashed var(--line);font-size:15px;color:var(--pencil)}

/* game */
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0 10px;border-bottom:1.5px solid var(--ink)}
.tb-title{display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tb-title .mt{font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.lv{font-size:13px;font-weight:700;border:1.5px solid var(--ink);padding:0 8px;margin-top:3px}
.score{text-align:right;white-space:nowrap}
.score b{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.score span{font-size:16px;margin-left:2px}
.ruler{position:relative;height:28px;border:1.5px solid var(--ink);background:var(--sheet);overflow:hidden}
.ruler i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hl);transition:width .5s}
.ruler.hit i{background:#ffd8d2}
.ruler::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 10%),repeating-linear-gradient(90deg,var(--pencil) 0 1px,transparent 1px 2%);background-size:100% 13px,100% 7px;background-repeat:no-repeat}
.rulerlab{display:flex;justify-content:space-between;font-size:14px;color:var(--pencil);margin-top:4px;font-variant-numeric:tabular-nums}
.rulerlab #stk{color:var(--red);font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.qno{font-family:var(--display);font-weight:700;font-size:24px}
.qno small{font-size:16px;color:var(--pencil)}
.qno .tag{font-family:var(--body);font-size:13px;font-weight:700;color:var(--ink);border:1.5px solid var(--ink);padding:1px 8px;margin-left:10px;vertical-align:middle}
.icon{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;min-height:40px;padding:4px 12px;font-size:15px;font-weight:600}
.icon:hover{background:var(--hl)}
.prompt{font-size:22px;line-height:1.65;margin-top:6px}
.prompt b{color:var(--ink);background:linear-gradient(transparent 60%,var(--hl) 60%)}
.pinote{font-size:15px;color:var(--pencil);white-space:nowrap}
.figbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0}
.fig{width:100%;max-width:380px;height:auto}
.fig .big{font-family:var(--body);font-weight:600;font-size:44px;fill:var(--ink)}
.fig .big.q{fill:var(--red)}
.fig .lbl{font-family:var(--body);font-weight:600;font-size:16px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.fig .or{fill:var(--orange)} .fig .bl{fill:var(--blue)} .fig .vi{fill:var(--violet)} .fig .gd{fill:var(--good)}
.fig .sm{font-family:var(--body);font-size:13px;fill:var(--pencil)}
.sfwrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.sec{transition:transform 1.1s cubic-bezier(.5,0,.2,1);transform-box:view-box;transform-origin:0 0}
.cl,.rl{transition:opacity .5s}
.rl{opacity:0}
.unf .rl{opacity:1}
.unf .cl{opacity:0}
.steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:16px 4px;border-top:1px dashed var(--line)}
.step.cur{background:linear-gradient(90deg,#fffbe0,transparent 70%)}
.step .sn{position:relative;width:32px;height:32px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;margin-top:2px}
.step.done .sn{color:var(--red)}
.step.done .sn::after{content:'';position:absolute;inset:-2px;border:2px solid var(--red);border-radius:50%;transform:rotate(-10deg)}
.sq{font-size:18px;margin-bottom:6px}
.sq b{background:linear-gradient(transparent 60%,var(--hl) 60%)}
.expr{font-size:22px;font-weight:500;line-height:2.4}
.slot{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 5px;line-height:1.2}
.slot input{font-family:var(--body);font-weight:600;font-size:23px;width:4.2em;text-align:center;padding:4px 2px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;color:var(--blue)}
.slot input:focus{outline:none;background:var(--hl)}
.slot input.bad{color:var(--red);background:var(--red-soft);text-decoration:line-through}
.slot input.good{background:var(--blue-soft)}
.slot small{font-size:12.5px;color:var(--pencil);margin-top:3px}
.slot .val{position:relative;display:inline-block;min-width:2.2em;text-align:center;color:var(--blue);font-weight:600;border-bottom:2px solid var(--ink);padding:0 6px}
.slot .val::after,.blank.ok::after,.opt.ok::after,.tok.ok::after{content:'';position:absolute;inset:-5px -7px;border:2px solid var(--red);border-radius:50%;transform:rotate(-4deg);pointer-events:none}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25;margin:0 4px}
.frac>span:first-child{border-bottom:2.5px solid var(--ink);padding:0 4px 3px}
.frac>span:last-child{padding-top:3px}
.frac .slot{margin:2px 0}
.frac .slot input{width:3em;font-size:20px;padding:1px 2px}
.frac .slot .val{border-bottom:0}
.blank{position:relative;display:inline-flex;align-items:flex-end;justify-content:center;min-width:4.6em;min-height:40px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;font-family:var(--body);font-weight:600;font-size:21px;color:var(--blue);padding:0 10px 2px;margin:0 4px;vertical-align:bottom;line-height:1.3}
.blank.active,.blank.hover{background:var(--hl)}
.blank.ok{cursor:default}
.blank.bad{color:var(--red);background:var(--red-soft);text-decoration:line-through;text-decoration-thickness:2px;animation:shake .35s}
.bank{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.chip{font-family:var(--body);font-weight:600;font-size:20px;padding:7px 16px;min-height:48px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;box-shadow:3px 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip:hover{background:var(--hl)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);background:var(--hl)}
.tip{font-size:14px;color:var(--pencil);margin-top:10px}
.opts{display:flex;flex-wrap:wrap;gap:12px}
.opt{position:relative;font-family:var(--body);font-weight:600;font-size:20px;padding:9px 22px;min-height:52px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px}
.opt:hover{background:var(--hl)}
.opt.ok{color:var(--blue);background:var(--sheet)}
.opt.no{color:var(--pencil);cursor:default;background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--red) calc(50% - 1.5px),var(--red) calc(50% + 1.5px),transparent calc(50% + 1.5px)),var(--sheet)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tok{position:relative;font-family:var(--body);font-weight:600;font-size:34px;min-width:66px;min-height:66px;border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet);font-variant-numeric:tabular-nums}
.tok:hover,.tok.sel{background:var(--hl)}
.tok.ok{color:var(--blue);background:var(--sheet)}
.tok.sym{border:0;background:transparent;min-width:22px;cursor:default}
.fb{min-height:1.6em;font-size:18px;margin-top:12px}
.fb.good{font-family:var(--hand);font-size:34px;line-height:1.1;color:var(--red)}
.fb.wrong{color:var(--red)}
.fb.reveal{color:var(--violet)}
.fb.info{color:var(--pencil)}
.donebox{border:1.5px dashed var(--red);padding:12px 16px;margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:18px}
.donebox.zero{border-color:var(--pencil)}
.pts{font-family:var(--hand);font-size:44px;line-height:1;color:var(--red)}
.donebox.zero .pts{color:var(--pencil)}
.bonus{font-family:var(--body);font-size:15px;color:var(--red);margin-left:10px;vertical-align:middle}
.lvmsg{font-weight:700;color:var(--violet)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* concept */
.csent{font-size:21px;line-height:2.5;margin-top:8px}
.example{border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 16px;margin-top:14px}
.example .exl{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--blue);margin-bottom:2px}

/* stamp */
.stamp{width:150px;height:150px;border-radius:50%;border:4px solid var(--red);box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 7px var(--red);color:var(--red);display:grid;place-items:center;text-align:center;font-family:var(--hand);font-size:40px;line-height:.95;transform:rotate(-12deg);margin:0 auto;animation:stampIn .35s ease-out;opacity:.92}
.stamp span{width:3.2em}
.stamp.sm{width:96px;height:96px;font-size:26px;border-width:3px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--red)}
@keyframes stampIn{from{transform:rotate(-12deg) scale(1.9);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.92}}

/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.scorewrap{display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap}
.bigscore{font-family:var(--display);font-weight:700;font-size:84px;line-height:1;font-variant-numeric:tabular-nums}
.bigscore small{font-size:28px;margin-left:4px}
.win{font-size:20px;font-weight:600}
.near{font-size:20px;color:var(--pencil)}
.newbest{font-family:var(--hand);font-size:36px;color:var(--red);line-height:1}
.nextgoal{font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin:0;border:1.5px solid var(--ink)}
.stats div{padding:10px 8px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats dt{font-size:14px;color:var(--pencil)}
.stats dd{margin:0;font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.stats dd small{font-size:16px;color:var(--pencil)}

/* records */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:16px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:700;font-size:14px;color:var(--pencil);border-bottom:1.5px solid var(--ink)}
.tablewrap{overflow-x:auto}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(28,28,28,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:28px 24px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}

@media (max-width:640px){
  h1{font-size:40px} h2{font-size:26px}
  .cover{grid-template-columns:1fr;border-left-width:10px;padding:24px 18px}
  .cover-fig{max-width:200px}
  .grid2{grid-template-columns:1fr}
  .expr{font-size:20px}
  .slot input{width:3.7em;font-size:21px}
  .prompt{font-size:20px}
  .stats dd{font-size:22px}
  .toc .m{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .sec,.cl,.rl,.ruler i{transition:none}
  .shake,.blank.bad,.stamp{animation:none}
}
.btn[disabled]{opacity:.4;cursor:default}
.review{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-left:8px solid var(--blue)}
.review h3{font-size:24px}
.danbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dan{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;padding:14px 6px;min-height:96px}
.dan:hover{background:var(--hl)}
.dan .dn{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.1}
.dan .dm{font-size:13px;color:var(--pencil)}
.dan.done .dm{color:var(--red);font-weight:700}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;padding:6px 16px 6px 8px;font-weight:600;min-height:52px}
.theme svg{width:36px;height:36px}
.theme:hover{background:#fffbe0}
.theme.on{background:var(--hl);box-shadow:inset 0 0 0 2px var(--ink)}
.gtable{display:grid;gap:3px;font-variant-numeric:tabular-nums;overflow-x:auto}
.gtable .gh,.gtable .gr{display:grid;grid-template-columns:3em repeat(9,minmax(28px,1fr));gap:3px}
.gh span{font-size:12px;color:var(--pencil);text-align:center}
.gd{font-weight:700;font-size:14px;align-self:center}
.gc{display:grid;place-items:center;height:30px;border:1px solid var(--line);font-size:13px;background:var(--sheet)}
.gc.s{background:var(--hl);border-color:#d8c652}
.gc.m{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.gtable.big .gc{height:38px;font-size:15px}
.legend{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--pencil);margin-top:8px;flex-wrap:wrap}
.legend .gc{display:inline-grid;width:28px;height:22px}
.bigact{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1.5px solid var(--ink);background:var(--sheet);border-radius:3px;padding:20px;min-height:130px}
.bigact:hover{background:#fffbe0}
.bigact b{font-family:var(--display);font-size:26px}
.bigact .label{margin:0}
.chants{list-style:none;margin:0;padding:4px 12px 10px}
.chants li{border-bottom:1px dashed var(--line)}
.chants li:last-child{border-bottom:0}
.chants button{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;padding:8px 6px;gap:12px}
.chants button:hover{background:var(--hl)}
.chants .eq{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.chants .eq b{color:var(--blue)}
.chants .ch{font-family:var(--hand);font-size:28px;color:var(--red);line-height:1}
.grp{cursor:pointer;outline:none}
.grp rect{fill:#fff;stroke:var(--ink);stroke-width:1.5}
.grp:hover rect{fill:#fffbe0}
.grp:focus-visible rect{stroke:var(--blue);stroke-width:3}
.grp.on rect{fill:var(--hl)}
.cnt{font-family:var(--body);font-weight:700;font-size:24px;fill:var(--blue)}
.cover-fig .grp{cursor:default}
.tallyline{text-align:center;font-size:22px;font-weight:600;color:var(--blue);min-height:1.5em;font-variant-numeric:tabular-nums}
.eqcard{text-align:center;border:1.5px dashed var(--red);padding:12px;margin-top:10px}
.eqbig{font-family:var(--body);font-weight:600;font-size:56px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.25}
.qbox{display:inline-block;min-width:1.6em;border-bottom:3px solid var(--ink);color:var(--pencil)}
.qbox.filled{color:var(--blue)}
.meaning{text-align:center;font-size:18px;color:var(--pencil)}
.chant{font-family:var(--hand);font-size:36px;color:var(--red);text-align:center;line-height:1.1}
.choices{display:grid;grid-template-columns:repeat(3,minmax(80px,1fr));gap:14px;max-width:520px;margin:12px auto 0}
.choice{position:relative;font-family:var(--body);font-weight:700;font-size:44px;min-height:96px;border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet);font-variant-numeric:tabular-nums}
.choice:hover{background:var(--hl)}
.choice.ok{color:var(--blue);background:var(--sheet)}
.choice.ok::after,.kdisp.ok::after{content:'';position:absolute;inset:6px 14%;border:2.5px solid var(--red);border-radius:50%;transform:rotate(-5deg);pointer-events:none}
.kdisp.ok::after{inset:0 calc(50% - 1.3em)}
.choice.no{color:var(--pencil);cursor:default;background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--red) calc(50% - 1.5px),var(--red) calc(50% + 1.5px),transparent calc(50% + 1.5px)),var(--sheet)}
.keypad-wrap{max-width:360px;margin:12px auto 0}
.kdisp{position:relative;font-weight:700;font-size:48px;text-align:center;border-bottom:3px solid var(--ink);min-height:72px;color:var(--blue);font-variant-numeric:tabular-nums;margin-bottom:12px}
.kdisp.bad{color:var(--red);text-decoration:line-through}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{font-weight:700;font-size:30px;min-height:66px;border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet)}
.keypad button:hover,.keypad button:active{background:var(--hl)}
.keypad .kfn{font-size:17px}
.keypad .kok{background:var(--ink);color:#fff;font-size:20px}
.keypad .kok:hover{background:#000}
.eqline{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvbtn{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;padding:12px 14px}
.lvbtn:hover{background:#fffbe0}
.lvbtn span{font-size:14px;color:var(--pencil)}
.lvbtn.on{background:var(--hl);box-shadow:inset 0 0 0 2px var(--ink)}
.weak{display:flex;flex-wrap:wrap;gap:10px}
.weak span{border:1.5px solid var(--ink);padding:4px 12px;font-weight:600;font-size:20px}
.weak small{font-size:13px;color:var(--red);margin-left:6px;font-weight:700}
@media (max-width:640px){
  .levels{grid-template-columns:1fr}
  .eqbig{font-size:44px}
  .choice{font-size:36px;min-height:84px}
  .dan .dn{font-size:28px}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<noscript><p style="padding:20px">이 연습장은 자바스크립트가 켜져 있어야 해요.</p></noscript>
<script>
/* ================= 기본 도구 ================= */
const $=(s,el=document)=>el.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SD=['','일','이','삼','사','오','육','칠','팔','구'];
function sino(n){if(n===0)return'영';const t=Math.floor(n/10),o=n%10;return (t?(t>1?SD[t]:'')+'십':'')+(o?SD[o]:'');}
const chant=(a,b)=>`${SD[a]}${SD[b]}${b===1?'은':''} ${sino(a*b)}`;
const ORDER=[2,5,3,4,6,7,8,9];

/* ================= 저장 ================= */
const QP=new URLSearchParams(location.search),EMBED=QP.get('embed')==='1';const post=m=>{try{parent.postMessage(Object.assign({src:'lp-game'},m),'*');}catch(e){}};
const KEY='gugudan.v1'+(EMBED?'.'+(QP.get('sid')||''):'');
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.facts)return j;}catch(e){}return{name:'',total:0,stamps:0,theme:'apple',sound:true,learned:{},facts:{},best:{},history:[]};}
let D=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
const fact=(a,b)=>D.facts[a+'x'+b]||(D.facts[a+'x'+b]={c:0,w:0,s:0});
const mastered=f=>f&&f.s>=3;
function reviewCount(){return Object.values(D.facts).filter(f=>(f.c+f.w)>0&&f.s<3).length;}

/* ================= 소리·읽어 주기 ================= */
let AC=null;
function tone(fs,dur=.12){if(!D.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const st=t+i*dur;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.22,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+dur);o.connect(g).connect(AC.destination);o.start(st);o.stop(st+dur+.03);});}catch(e){}}
const sndGood=()=>tone([660,880]),sndBad=()=>tone([220,180],.15),sndWin=()=>tone([523,659,784,1046],.13),sndTap=k=>tone([330+k*40],.09);
const canSpeak='speechSynthesis' in window;
function say(t){if(!canSpeak)return;try{const u=new SpeechSynthesisUtterance(t.replace(/×/g,' 곱하기 ').replace(/=/g,' 는 ').replace(/\?/g,' 몇 ').replace(/□/g,' 네모 '));u.lang='ko-KR';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const sayBtn=(id='say')=>canSpeak?`<button class="icon" id="${id}" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>읽어 주기</button>`:'';

/* ================= 그림 ================= */
const THEMES={apple:'사과',star:'별',ball:'공',flower:'꽃'};
function item(x,y,s,t){
  const r=s/2;
  if(t==='apple')return `<g transform="translate(${x} ${y})"><circle cy="${r*.12}" r="${r*.78}" fill="#d8433a"/><path d="M0 ${-r*.55} q1 ${-r*.4} ${r*.18} ${-r*.5}" stroke="#5b3a1e" stroke-width="2" fill="none"/><ellipse cx="${r*.36}" cy="${-r*.72}" rx="${r*.3}" ry="${r*.15}" fill="#3f8f3a" transform="rotate(-25 ${r*.36} ${-r*.72})"/><circle cx="${-r*.3}" cy="${-r*.1}" r="${r*.14}" fill="#fff" opacity=".45"/></g>`;
  if(t==='star'){let p=[];for(let i=0;i<10;i++){const rr=i%2?r*.42:r*.95,an=-Math.PI/2+i*Math.PI/5;p.push((x+rr*Math.cos(an)).toFixed(1)+','+(y+rr*Math.sin(an)).toFixed(1));}return `<polygon points="${p.join(' ')}" fill="#f1b80f" stroke="#b88700" stroke-width="1.2" stroke-linejoin="round"/>`;}
  if(t==='ball')return `<g transform="translate(${x} ${y})"><circle r="${r*.85}" fill="#2f66c4"/><path d="M${-r*.85} 0 Q0 ${r*.5} ${r*.85} 0 M0 ${-r*.85} Q${r*.45} 0 0 ${r*.85}" stroke="#fff" stroke-width="2" fill="none"/></g>`;
  let g=`<g transform="translate(${x} ${y})">`;for(let i=0;i<5;i++){const an=i*72*Math.PI/180;g+=`<circle cx="${(Math.cos(an)*r*.48).toFixed(1)}" cy="${(Math.sin(an)*r*.48).toFixed(1)}" r="${r*.38}" fill="#e46b9c"/>`;}return g+`<circle r="${r*.3}" fill="#f4c430"/></g>`;
}
/* a개씩 b묶음 그림. 상자를 누르면 뛰어 세기 */
function groupsSVG(a,b,o={}){
  const per=5,BW=96,BH=96,GX=14,LH=36,rows=Math.ceil(b/per),cols=Math.min(b,per),W=cols*BW+(cols-1)*GX+8,H=rows*(BH+LH)+4;
  const c={1:1,2:2,3:3,4:2,5:3,6:3,7:3,8:3,9:3}[a],rr=Math.ceil(a/c),sz=24,gap=4;
  let s=`<svg class="fig groups" viewBox="0 0 ${W} ${H}" role="img" aria-label="${a}개씩 ${b}묶음" style="max-width:${Math.min(620,W*1.1)}px">`;
  for(let k=0;k<b;k++){
    const gx=4+(k%per)*(BW+GX),gy=2+Math.floor(k/per)*(BH+LH);
    const iw=c*sz+(c-1)*gap,ih=rr*sz+(rr-1)*gap,ox=gx+(BW-iw)/2+sz/2,oy=gy+(BH-ih)/2+sz/2;
    let it='';for(let i=0;i<a;i++){const row=Math.floor(i/c),inRow=row===rr-1?a-row*c:c,shift=(c-inRow)*(sz+gap)/2;it+=item(ox+shift+(i%c)*(sz+gap),oy+row*(sz+gap),sz,D.theme);}
    s+=`<g class="grp ${o.counted?'on':''}" data-k="${k}" ${o.tap?'tabindex="0" role="button" aria-label="'+(k+1)+'번째 묶음"':''}><rect x="${gx}" y="${gy}" width="${BW}" height="${BH}" rx="6"/>${it}<text class="cnt" x="${gx+BW/2}" y="${gy+BH+27}" text-anchor="middle">${o.counted?a*(k+1):''}</text></g>`;
  }
  return s+'</svg>';
}
/* 뛰어 세기 수직선 */
function seqSVG(terms,miss,a){
  const n=terms.length,BW=74,GX=40,W=n*BW+(n-1)*GX+8,H=130;let s=`<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="${a}씩 뛰어 세기" style="max-width:640px">`;
  terms.forEach((t,i)=>{const x=4+i*(BW+GX);s+=`<rect x="${x}" y="58" width="${BW}" height="60" rx="5" fill="${i===miss?'var(--hl)':'#fff'}" stroke="var(--ink)" stroke-width="1.5"/><text class="big" x="${x+BW/2}" y="102" text-anchor="middle" font-size="34">${i===miss?'?':t}</text>`;
    if(i<n-1){const x1=x+BW/2,x2=x+BW+GX+BW/2;s+=`<path d="M${x1} 54 Q${(x1+x2)/2} 6 ${x2} 54" fill="none" stroke="var(--red)" stroke-width="2"/><text class="lbl" x="${(x1+x2)/2}" y="26" text-anchor="middle" fill="var(--red)">+${a}</text>`;}});
  return s+'</svg>';
}
function wireGroups(root,a,b,onDone){
  let n=0;const gs=[...root.querySelectorAll('.grp')];
  const tap=g=>{if(g.classList.contains('on'))return;g.classList.add('on');n++;const t=g.querySelector('.cnt');t.textContent=a*n;sndTap(n);say(String(a*n));const line=$('#tally');if(line)line.innerHTML=gs.filter(x=>x.classList.contains('on')).map((_,i)=>a*(i+1)).join(' → ');if(n===b&&onDone)setTimeout(onDone,500);};
  gs.forEach(g=>{g.addEventListener('click',()=>tap(g));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(g);}});});
}

/* ================= 화면 공통 ================= */
const app=$('#app');
function setScreen(html){app.innerHTML=html;window.scrollTo(0,0);}
function stampOverlay(title,msg,buttons){
  sndWin();const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="stamp" aria-hidden="true"><span>참<br>잘했어요</span></div><h2 id="ovt">${title}</h2><p>${msg}</p>${buttons}</div>`;
  document.body.appendChild(ov);const f=ov.querySelector('button');f&&f.focus();return ov;
}
function gtable(big){
  let s=`<div class="gtable ${big?'big':''}" role="table" aria-label="내 구구단 표"><div class="gh" role="row"><span></span>${[1,2,3,4,5,6,7,8,9].map(b=>`<span role="columnheader">×${b}</span>`).join('')}</div>`;
  for(const a of [2,3,4,5,6,7,8,9]){s+=`<div class="gr" role="row"><span class="gd" role="rowheader">${a}단</span>`;for(let b=1;b<=9;b++){const f=D.facts[a+'x'+b],st=!f||(f.c+f.w)===0?'':mastered(f)?'m':'s';s+=`<span class="gc ${st}" role="cell" title="${a} × ${b}">${st?a*b:''}</span>`;}s+='</div>';}
  return s+`</div><p class="legend"><span class="gc s">6</span> 연습 중 <span class="gc m">6</span> 3번 연속 바로 맞힘</p>`;
}

/* ================= 표지 ================= */
function home(msg){
  const rc=reviewCount(),learned=Object.keys(D.learned).map(Number);
  setScreen(`
  <header class="cover">
    <div class="cover-main"><p class="kicker">곱셈구구</p><h1>구구단 연습장</h1><p class="sub">그림을 세면서 익히는 2단부터 9단</p>
      <form class="nameplate" id="nmf"><label for="nm">이름</label><input id="nm" value="${esc(D.name)}" maxlength="10" autocomplete="off" placeholder="여기에 써요"><button class="btn sm" type="submit">정하기</button></form>
      ${msg?`<p class="warn" role="alert">${msg}</p>`:''}
      <p class="tally">모은 점수 <b>${D.total}</b>점 · 받은 도장 <b>${D.stamps}</b>개</p></div>
    <div class="cover-fig">${groupsSVG(3,2,{counted:true})}</div>
  </header>
  ${learned.length?`<section class="sheet review"><div><p class="label">오늘 먼저</p><h3>배운 단 복습하기</h3><p class="small">${learned.sort((x,y)=>x-y).map(x=>x+'단').join(', ')} 중에서 나와요.${rc?` 다시 볼 문제가 ${rc}개 있어요.`:''}</p></div><button class="btn blue" type="button" id="rv">복습 시작</button></section>`:''}
  <section class="sheet"><h2 class="sec-h">몇 단을 할까요?</h2>
    <div class="danbtns">${ORDER.map((a,i)=>{const done=D.learned[a],m=[1,2,3,4,5,6,7,8,9].filter(b=>mastered(D.facts[a+'x'+b])).length;return `<button class="dan ${done?'done':''}" type="button" data-dan="${a}"><span class="dn">${a}단</span><span class="dm">${done?`배움 · ${m}/9`:`${i+1}번째 추천`}</span></button>`;}).join('')}</div>
    <p class="small" style="margin-top:10px">2단 → 5단 → 3단 → 4단 순서로 하면 쉬워요.</p></section>
  <section class="sheet"><p class="label">그림 고르기</p><div class="themes">${Object.entries(THEMES).map(([k,v])=>`<button class="theme ${D.theme===k?'on':''}" type="button" data-th="${k}"><svg viewBox="0 0 40 40" aria-hidden="true">${item(20,20,30,k)}</svg>${v}</button>`).join('')}</div></section>
  <section class="sheet"><p class="label">내 구구단 표</p>${gtable()}</section>
  <footer class="foot"><button class="textbtn" type="button" id="snd">소리 ${D.sound?'켜짐':'꺼짐'}</button><span aria-hidden="true">·</span><button class="textbtn" type="button" id="rec">기록 보기</button></footer>`);
  $('#nmf').onsubmit=e=>{e.preventDefault();D.name=$('#nm').value.trim();save();home();};
  app.querySelectorAll('[data-dan]').forEach(b=>b.onclick=()=>dan(+b.dataset.dan));
  app.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{D.theme=b.dataset.th;save();home();});
  if($('#rv'))$('#rv').onclick=()=>goal('review');
  $('#snd').onclick=()=>{D.sound=!D.sound;save();home();};
  $('#rec').onclick=records;
}

/* ================= 단 화면 ================= */
function dan(a){
  setScreen(`
  <button class="btn ghost sm back" type="button" id="bk">← 처음으로</button>
  <header class="chap"><span class="chap-no">${a}단</span><div><h2>${a}씩 커져요</h2><p class="small">${[1,2,3,4,5,6,7,8,9].map(b=>a*b).join(', ')}</p></div></header>
  <div class="grid2">
    <button class="bigact" type="button" id="learn"><span class="label">1</span><b>그림으로 배우기</b><span class="small">상자를 눌러 ${a}씩 세어 봐요</span></button>
    <button class="bigact" type="button" id="play"><span class="label">2</span><b>문제 풀기</b><span class="small">최고 ${D.best['d'+a]||0}점${D.learned[a]?'':' · 배우기를 먼저 하면 좋아요'}</span></button>
  </div>
  <section class="keybox"><h3>${a}단 외우기 · 줄을 누르면 읽어 줘요</h3><ol class="chants">${[1,2,3,4,5,6,7,8,9].map(b=>`<li><button type="button" data-b="${b}"><span class="eq">${a} × ${b} = <b>${a*b}</b></span><span class="ch">${chant(a,b)}</span></button></li>`).join('')}</ol></section>`);
  $('#bk').onclick=()=>home();$('#learn').onclick=()=>learn(a,1);$('#play').onclick=()=>goal('d'+a);
  app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>say(chant(a,+b.dataset.b)));
}

/* ================= 그림으로 배우기 ================= */
function learn(a,b){
  setScreen(`
  <button class="btn ghost sm back" type="button" id="bk">← ${a}단</button>
  <article class="sheet">
    <div class="qhead"><span class="qno">${a}단 배우기<small> · ${b} / 9</small></span>${sayBtn()}</div>
    <div class="cdots" aria-hidden="true">${[1,2,3,4,5,6,7,8,9].map(k=>`<span class="${k<b?'d':k===b?'c':''}"></span>`).join('')}</div>
    <p class="prompt"><b>${a}개씩 ${b}묶음</b>이에요. 상자를 하나씩 눌러 세어 봐요.</p>
    <div class="figbox" id="fig">${groupsSVG(a,b,{tap:true})}</div>
    <p class="tallyline" id="tally" aria-live="polite"></p>
    <div id="eqbox"></div>
    <div class="actions"><button class="btn ghost" type="button" id="prev" ${b===1?'disabled':''}>← 앞으로</button><button class="btn blue" type="button" id="next" disabled>${b===9?'다 배웠어요 →':'다음 →'}</button></div>
  </article>`);
  $('#bk').onclick=()=>dan(a);
  $('#say').onclick=()=>say(`${a}개씩 ${b}묶음. 상자를 하나씩 눌러 세어 봐요.`);
  $('#prev').onclick=()=>learn(a,b-1);
  $('#next').onclick=()=>{if(b<9)learn(a,b+1);else learnDone(a);};
  wireGroups(app,a,b,()=>{
    $('#eqbox').innerHTML=`<div class="eqcard"><p class="eqbig">${a} × ${b} = <span class="red">${a*b}</span></p><p class="chant">${chant(a,b)}</p></div>`;
    say(chant(a,b));const n=$('#next');n.disabled=false;n.focus();
  });
}
function learnDone(a){
  if(EMBED){const first=!D.learned[a];D.learned[a]=true;if(first){D.stamps++;D.total+=20;}save();post({type:'session',mode:'learn-'+a,achieved:true,score:0});const ov=stampOverlay(`${a}단 배우기 끝`,'과제를 끝냈어요. 잘했어요.','<button class="btn big blue" type="button" id="cl">과제 목록으로</button>');$('#cl').onclick=()=>{ov.remove();post({type:'close'});};return;}
  const first=!D.learned[a];D.learned[a]=true;if(first){D.stamps++;D.total+=20;}save();
  dan(a);
  if(first){const ov=stampOverlay(`${a}단 배우기 끝`,`도장을 하나 받았어요. 이제 문제를 풀어 볼까요?`,`<button class="btn big blue" type="button" id="go">문제 풀기</button><button class="btn ghost" type="button" id="cl">조금 있다가</button>`);
    $('#go').onclick=()=>{ov.remove();goal('d'+a);};$('#cl').onclick=()=>ov.remove();}
}

/* ================= 목표 정하기 ================= */
const round10=x=>Math.ceil(x/10)*10;
const modeName=m=>m==='review'?'배운 단 복습':m.slice(1)+'단 문제 풀기';
function goal(mode){
  const best=D.best[mode]||0,beat=round10(best+10);let g=best?Math.min(beat,best+20):50,lv=D.lastLevel||1;
  const hist=D.history.filter(h=>h.m===mode).slice(0,8).reverse(),mx=Math.max(10,...hist.map(h=>h.s));
  const draw=()=>{
    setScreen(`
    <button class="btn ghost sm back" type="button" id="bk">← ${mode==='review'?'처음으로':mode.slice(1)+'단'}</button>
    <article class="sheet goal">
      <div><p class="label">문제 풀기</p><h2>${modeName(mode)}</h2></div>
      <div class="mybest"><div><p class="small">내 최고 기록</p><p class="v">${best}<small>점</small></p></div>
        ${hist.length?`<div class="spark" aria-label="최근 점수">${hist.map(h=>`<div class="${h.ok?'ok':''}" style="height:${Math.max(6,h.s/mx*56)}px"><span>${h.s}</span></div>`).join('')}</div>`:'<p class="small">첫 기록을 만들어 봐요.</p>'}</div>
      <div><p class="label">오늘의 목표</p>
        <div class="goalpick"><button class="btn ghost" type="button" id="gm" aria-label="10점 내리기">−10</button><output>${g}<small>점</small></output><button class="btn ghost" type="button" id="gp" aria-label="10점 올리기">+10</button></div>
        <div class="presets">${[30,50,80,100].map(x=>`<button class="pill ${x===g?'on':''}" type="button" data-g="${x}">${x}</button>`).join('')}${best?`<button class="pill hot ${g===beat?'on':''}" type="button" data-g="${beat}">최고 기록 넘기 ${beat}</button>`:''}</div></div>
      <div><p class="label">어떻게 풀까요?</p><div class="levels">${[[1,'그림 세고 고르기','상자를 눌러 세어 보고 답을 골라요'],[2,'그림 보고 고르기','그림을 보고 답을 골라요'],[3,'번호 눌러 쓰기','숫자 판을 눌러 답을 써요']].map(([v,t,d])=>`<button class="lvbtn ${v===lv?'on':''}" type="button" data-lv="${v}"><b>${v}. ${t}</b><span>${d}</span></button>`).join('')}</div></div>
      <ul class="rules"><li>처음에 맞히면 10점, 다시 해서 맞히면 5점</li><li>3문제 연속으로 맞히면 5점 더</li><li>목표를 넘으면 도장을 받아요</li></ul>
      <button class="btn big blue" type="button" id="go">목표 ${g}점으로 시작하기</button>
    </article>`);
    $('#bk').onclick=()=>mode==='review'?home():dan(+mode.slice(1));
    $('#gm').onclick=()=>{g=Math.max(10,g-10);draw();};$('#gp').onclick=()=>{g=Math.min(500,g+10);draw();};
    app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=+b.dataset.g;draw();});
    app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;draw();});
    $('#go').onclick=()=>{D.lastLevel=lv;save();startGame(mode,g,lv);};
  };
  draw();
}

/* ================= 문제 만들기 ================= */
let G=null;
function weightOf(a,b){const f=D.facts[a+'x'+b];if(!f||(f.c+f.w)===0)return 2;if(f.s<3&&f.w>0)return 5;if(f.s<3)return 3;return 1;}
function pickFact(){
  const dans=G.mode==='review'?Object.keys(D.learned).map(Number):[+G.mode.slice(1)];if(!dans.length)dans.push(2,5);
  const list=[];dans.forEach(a=>{for(let b=1;b<=9;b++){if(G.last===a+'x'+b)continue;list.push([a,b,weightOf(a,b)*(G.mode==='review'?1:(b===1?.5:1))]);}});
  let t=list.reduce((s,x)=>s+x[2],0),r=Math.random()*t;for(const x of list){r-=x[2];if(r<=0)return[x[0],x[1]];}return[list[0][0],list[0][1]];
}
function choicesFor(ans,step){const c=[ans-step,ans+step,ans+1,ans-1,ans+2*step].filter(x=>x>0&&x!==ans);return shuffle([ans,...shuffle([...new Set(c)]).slice(0,2)]);}
function makeQ(){
  const[a,b]=pickFact();G.last=a+'x'+b;
  if(G.level>=2&&Math.random()<.2){const k0=R(1,5),terms=[0,1,2,3,4].map(i=>a*(k0+i)),miss=R(1,3);return{type:'seq',a,b:k0+miss,terms,miss,ans:terms[miss],opts:choicesFor(terms[miss],a)};}
  return{type:'mul',a,b,ans:a*b,opts:choicesFor(a*b,a)};
}

/* ================= 문제 풀기 ================= */
function startGame(mode,goalPts,level){G={mode,goal:goalPts,level,score:0,streak:0,solved:0,first:0,goalHit:false,stampsNow:0,prevBest:D.best[mode]||0,last:''};nextQ();}
function nextQ(){
  const q=G.q=makeQ();G.tries=0;G.hint=false;G.done=false;G.input='';
  const mul=q.type==='mul',showFig=G.level<3;
  setScreen(`
  <div class="topbar"><button class="btn ghost sm" type="button" id="quit">그만하기</button>
    <div class="tb-title"><span class="mt">${modeName(G.mode)}</span><span class="lv">${['','그림 세고 고르기','그림 보고 고르기','번호 눌러 쓰기'][G.level]}</span></div>
    <div class="score"><b id="sc">${G.score}</b><span>점</span></div></div>
  <div class="progress"><div class="ruler" id="gbar" role="progressbar" aria-label="목표까지" aria-valuemin="0" aria-valuemax="100"><i id="gb"></i></div>
    <div class="rulerlab"><span>0</span><span id="stk"></span><span>목표 <b id="gl">${G.goal}</b>점</span></div></div>
  <article class="sheet" id="qcard">
    <div class="qhead"><span class="qno">문제 ${G.solved+1}</span>${sayBtn()}</div>
    ${mul?`<p class="eqbig q">${q.a} × ${q.b} = <span class="qbox" id="qb">?</span></p><p class="meaning">${q.a}개씩 ${q.b}묶음</p>`:`<p class="prompt"><b>${q.a}씩 뛰어 세기</b>예요. 빈 곳에 들어갈 수는?</p>`}
    <div class="figbox" id="fig">${mul?(showFig?groupsSVG(q.a,q.b,{tap:G.level===1}):`<button class="btn ghost" type="button" id="showfig">그림 보기 (힌트)</button>`):seqSVG(q.terms,q.miss,q.a)}</div>
    ${mul&&G.level===1?'<p class="tip" id="tip">상자를 하나씩 눌러 세어 봐요. 다 세면 답을 고를 수 있어요.</p><p class="tallyline" id="tally" aria-live="polite"></p>':''}
    <div id="answer"></div>
    <p class="fb" id="fb" role="status"></p>
    <div id="donebox"></div>
    <div class="actions" id="acts"></div>
  </article>`);
  $('#quit').onclick=endGame;
  $('#say').onclick=()=>say(mul?`${q.a} 곱하기 ${q.b}는?`:`${q.a}씩 뛰어 세기. 빈 곳에 들어갈 수는?`);
  if($('#showfig'))$('#showfig').onclick=()=>{G.hint=true;$('#fig').innerHTML=groupsSVG(q.a,q.b,{tap:true});wireGroups(app,q.a,q.b);};
  updateTop();
  if(mul&&G.level===1)wireGroups(app,q.a,q.b,()=>{$('#tip').textContent='다 셌어요! 답을 골라요.';renderAnswer();});
  else renderAnswer();
}
function updateTop(){
  $('#sc').textContent=G.score;$('#gl').textContent=G.goal;
  const pct=Math.min(100,G.score/G.goal*100);$('#gb').style.width=pct+'%';$('#gbar').setAttribute('aria-valuenow',Math.round(pct));$('#gbar').classList.toggle('hit',G.score>=G.goal);
  $('#stk').textContent=G.streak>=2?`${G.streak}문제 연속 정답`:'';
}
function fb(t,k){const e=$('#fb');e.className='fb '+k;e.innerHTML=t;}
function renderAnswer(){
  const q=G.q,box=$('#answer');
  if(G.level<3||q.type==='seq'){
    box.innerHTML=`<div class="choices">${q.opts.map(o=>`<button class="choice" type="button" data-v="${o}">${o}</button>`).join('')}</div>`;
    box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.disabled||G.done)return;if(+b.dataset.v===q.ans){b.classList.add('ok');right();}else{b.classList.add('no');b.disabled=true;wrong();}});
    return;
  }
  box.innerHTML=`<div class="keypad-wrap"><div class="kdisp" id="kd" aria-live="polite">&nbsp;</div><div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="del" class="kfn">지우기</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="kok">확인</button></div></div>`;
  const kd=$('#kd'),show=()=>{kd.textContent=G.input||' ';kd.classList.remove('bad');};
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(G.done)return;const k=b.dataset.k;
    if(k==='del')G.input=G.input.slice(0,-1);else if(k==='ok'){if(!G.input){fb('번호를 눌러 답을 써요.','info');return;}if(+G.input===q.ans){kd.classList.add('ok');right();}else{kd.classList.add('bad');wrong();G.input='';setTimeout(show,700);}return;}
    else if(G.input.length<2)G.input+=k;show();});
}
function right(){
  const q=G.q;G.done=true;sndGood();
  const perfect=G.tries===0&&!G.hint,pts=perfect?10:5;let bonus=0;
  if(perfect){G.streak++;G.first++;if(G.streak>=3)bonus=5;}else G.streak=0;
  G.score+=pts+bonus;G.solved++;D.total+=pts+bonus;D.best[G.mode]=Math.max(D.best[G.mode]||0,G.score);
  if(q.type==='mul'){const f=fact(q.a,q.b);if(perfect){f.c++;f.s++;}else{f.w++;f.s=0;}if(EMBED)post({type:'fact',key:q.a+'x'+q.b,ok:perfect});}
  save();finishQ(pts+bonus,bonus);
}
function wrong(){
  sndBad();G.tries++;const q=G.q,card=$('#qcard');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
  if(q.type==='mul'&&!$('#fig .grp')){$('#fig').innerHTML=groupsSVG(q.a,q.b,{tap:true});wireGroups(app,q.a,q.b);}
  if(G.tries>=2){G.done=true;G.streak=0;G.solved++;if(q.type==='mul'){const f=fact(q.a,q.b);f.w++;f.s=0;if(EMBED)post({type:'fact',key:q.a+'x'+q.b,ok:false});}save();
    app.querySelectorAll('.choice').forEach(b=>{if(+b.dataset.v===q.ans)b.classList.add('ok');b.disabled=true;});
    const kd=$('#kd');if(kd){kd.textContent=q.ans;kd.className='kdisp ok';}
    if(q.type==='mul'){$('#fig').innerHTML=groupsSVG(q.a,q.b,{counted:true});}
    fb('정답을 알려 줄게요. 그림의 수를 같이 세어 봐요.','reveal');finishQ(0,0);return;}
  fb(q.type==='mul'?`다시 해 봐요. 상자를 눌러 ${q.a}씩 세어 봐요.`:`다시 해 봐요. ${q.a}씩 커져요.`,'wrong');
}
function finishQ(pts,bonus){
  const q=G.q;
  if(q.type==='mul'){$('#qb').textContent=q.ans;$('#qb').classList.add('filled');}
  if(pts)fb(pick(['맞았어요','잘했어요','정답','좋아요']),'good');
  const line=q.type==='mul'?`<p class="eqline">${q.a} × ${q.b} = ${q.ans}</p><p class="chant">${chant(q.a,q.b)}</p>`:`<p class="eqline">${q.terms.join(', ')}</p><p class="chant">${q.a}씩 커져요</p>`;
  $('#donebox').innerHTML=`<div class="donebox ${pts?'':'zero'}"><p class="pts">+${pts}${bonus?`<span class="bonus">연속 정답 +${bonus} 포함</span>`:''}</p>${line}</div>`;
  if(q.type==='mul')setTimeout(()=>say(chant(q.a,q.b)),350);
  $('#acts').innerHTML=`<button class="btn blue big" type="button" id="nq">다음 문제 →</button>`;$('#nq').onclick=nextQ;
  updateTop();setTimeout(()=>{const n=$('#nq');if(n&&!$('.overlay'))n.focus();},80);
  if(G.score>=G.goal&&!G.goalHit){G.goalHit=true;if(EMBED)post({type:'goal',mode:G.mode,score:G.score,goal:G.goal,level:G.level});setTimeout(()=>{D.stamps++;G.stampsNow++;save();
    const ov=stampOverlay(`목표 ${G.goal}점 달성`,`${D.name?esc(D.name)+', ':''}도장을 하나 받았어요. 모은 도장은 ${D.stamps}개예요.`,`<button class="btn big blue" type="button" id="up">목표 +30점 올려서 계속하기</button><button class="btn ghost" type="button" id="fin">여기서 끝내기</button>`);
    $('#up').onclick=()=>{G.goal+=30;G.goalHit=false;ov.remove();updateTop();$('#nq').focus();};$('#fin').onclick=()=>{ov.remove();endGame();};},450);}
}
function endGame(){
  const ov=$('.overlay');if(ov)ov.remove();
  if(!G||G.solved===0){const m=G?G.mode:'review';G=null;m==='review'?home():dan(+m.slice(1));return;}
  const g=G,ok=g.stampsNow>0,best=Math.max(g.prevBest,g.score),next=round10(best+10),newBest=g.score>g.prevBest;
  D.history.unshift({d:Date.now(),m:g.mode,s:g.score,g:g.goal,ok,n:g.solved,f:g.first,l:g.level});D.history=D.history.slice(0,80);save();if(EMBED)post({type:'session',mode:g.mode,score:g.score,goal:g.goal,achieved:ok||g.score>=g.goal,solved:g.solved,first:g.first,level:g.level});
  setScreen(`
  <article class="sheet result">
    <p class="label">${modeName(g.mode)}</p>
    <div class="scorewrap"><div class="bigscore">${g.score}<small>점</small></div>${ok?'<div class="stamp sm" aria-label="참 잘했어요 도장"><span>참<br>잘했어요</span></div>':''}</div>
    <p class="${ok?'win':'near'}">${ok?`목표를 넘었어요. 도장 ${g.stampsNow}개를 받았어요.`:`목표까지 ${g.goal-g.score}점 남았어요. 다음엔 할 수 있어요.`}</p>
    ${newBest?'<p class="newbest">새 최고 기록!</p>':''}
    <dl class="stats"><div><dt>푼 문제</dt><dd>${g.solved}</dd></div><div><dt>바로 맞힌 문제</dt><dd>${g.first}</dd></div><div><dt>다음 목표</dt><dd>${next}</dd></div></dl>
    <div class="actions" style="justify-content:center"><button class="btn ghost" type="button" id="home">${EMBED?'과제 목록으로':'처음으로'}</button><button class="btn blue" type="button" id="again">${next}점 목표로 다시 하기</button></div>
  </article>`);
  $('#home').onclick=()=>home();$('#again').onclick=()=>startGame(g.mode,next,g.level);G=null;
}

/* ================= 기록 ================= */
function records(confirmDel){
  const dt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
  const weak=Object.entries(D.facts).filter(([k,f])=>f.w>0&&f.s<3).sort((x,y)=>y[1].w-x[1].w).slice(0,12);
  setScreen(`
  <button class="btn ghost sm back" type="button" id="bk">← 처음으로</button>
  <h2>${D.name?esc(D.name)+'의 ':''}구구단 기록</h2>
  <section class="sheet"><dl class="stats"><div><dt>모은 점수</dt><dd>${D.total}</dd></div><div><dt>받은 도장</dt><dd>${D.stamps}</dd></div><div><dt>배운 단</dt><dd>${Object.keys(D.learned).length}<small> / 8</small></dd></div></dl></section>
  <section class="sheet"><p class="label">구구단 표</p>${gtable(true)}</section>
  <section class="sheet"><p class="label">자주 틀린 문제</p>${weak.length?`<p class="weak">${weak.map(([k,f])=>{const[a,b]=k.split('x');return `<span>${a} × ${b} <small>틀림 ${f.w}</small></span>`;}).join('')}</p>`:'<p class="small">아직 없어요.</p>'}</section>
  <section class="sheet"><p class="label">최근 도전</p>${D.history.length?`<div class="tablewrap"><table><thead><tr><th>날짜</th><th>문제</th><th>방법</th><th>점수 / 목표</th><th>바로 맞힘</th><th>도장</th></tr></thead><tbody>${D.history.slice(0,15).map(h=>`<tr><td>${dt(h.d)}</td><td>${modeName(h.m)}</td><td>${h.l||1}</td><td>${h.s} / ${h.g}</td><td>${h.f} / ${h.n}</td><td>${h.ok?'<span class="red">○</span>':''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small">아직 끝낸 도전이 없어요.</p>'}</section>
  <div class="row" style="justify-content:flex-end">${confirmDel?`<span class="warn" style="margin:0">기록을 모두 지울까요?</span><button class="btn ghost sm" type="button" id="no">취소</button><button class="btn sm danger" type="button" id="yes">지우기</button>`:`<button class="textbtn" type="button" id="del">기록 모두 지우기</button>`}</div>`);
  $('#bk').onclick=()=>home();
  if(confirmDel){$('#no').onclick=()=>records();$('#yes').onclick=()=>{const keep={theme:D.theme,sound:D.sound,name:D.name};localStorage.removeItem(KEY);D=load();Object.assign(D,keep);save();records();};}
  else $('#del').onclick=()=>records(true);
}

if(EMBED){D.name=QP.get('name')||D.name;const md=QP.get('mode')||'d2';home=()=>post({type:'close'});dan=()=>post({type:'close'});records=()=>post({type:'close'});if(md.startsWith('learn-'))learn(+md.slice(6),1);else startGame(md,+QP.get('goal')||50,+QP.get('level')||1);}else home();
</script>
</body>
</html>
