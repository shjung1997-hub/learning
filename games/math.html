<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  /* 연습장 한 권: 줄 노트 바탕 + 검정 인쇄 + 파란 펜(학생 답) + 빨간 펜(채점) + 형광펜(지금 할 곳) */
  --paper:#f3f3ef; --sheet:#ffffff; --rule:#dfe5ec; --line:#d3d0c8;
  --ink:#1c1c1c; --pencil:#625f58;
  --blue:#1d4b97; --blue-soft:#e8eef8;
  --red:#cc2f26; --red-soft:#fcebe9;
  --hl:#fff09a;
  --orange:#d7802a; --violet:#5a4aa6; --good:#2c7a49;
  --circleFill:#eef3f9;
  --display:'Gowun Batang','Nanum Myeongjo',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --hand:'Nanum Pen Script','Gowun Batang',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--paper);background-image:linear-gradient(transparent 31px,var(--rule) 32px);background-size:100% 32px;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:50px;letter-spacing:-.01em}
h2{font-size:30px}
h3{font-size:21px}
p{margin:0}
b{font-weight:700}
.small{font-size:15px;color:var(--pencil)}
.red{color:var(--red)}
.hl{background:var(--hl);padding:0 4px;font-weight:700;color:var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 72px;display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:22px}
.label{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:700;letter-spacing:.06em;padding:2px 9px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{font-family:var(--body);font-weight:700;font-size:18px;background:var(--ink);color:#fff;border:1.5px solid var(--ink);border-radius:5px;padding:10px 20px;min-height:50px}
.btn:hover{background:#000}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--sheet);color:var(--ink)}
.btn.ghost:hover{background:var(--hl)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{font-size:15px;min-height:40px;padding:5px 14px}
.btn.big{font-size:20px;min-height:58px;width:100%}
.textbtn{background:none;border:0;padding:4px 2px;font-size:15px;color:var(--pencil);text-decoration:underline;text-underline-offset:3px}
.pill{font-weight:600;font-size:16px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;padding:5px 14px;min-height:42px;font-variant-numeric:tabular-nums}
.pill:hover{background:var(--hl)}
.pill.on{background:var(--ink);color:#fff}
.pill.hot{border-style:dashed}
.back{align-self:flex-start}
.warn{color:var(--red);font-weight:700;margin-top:10px}

/* cover */
.cover{background:var(--sheet);border:1.5px solid var(--ink);border-left:14px solid var(--ink);display:grid;grid-template-columns:1fr 230px;gap:20px;padding:30px 28px;align-items:center}
.kicker{font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--pencil)}
.cover .sub{font-family:var(--display);font-size:20px;color:var(--pencil);margin-top:4px}
.nameplate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;border:1.5px solid var(--ink);padding:10px 14px;max-width:420px}
.nameplate label{font-family:var(--display);font-weight:700;font-size:20px}
.nameplate input{flex:1;min-width:8em;font-family:var(--body);font-weight:600;font-size:22px;color:var(--blue);border:0;border-bottom:2px solid var(--ink);background:transparent;padding:4px 2px;border-radius:0}
.nameplate input:focus{outline:none;background:var(--hl)}
.names{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.names .small{margin-right:4px}
.tally{margin-top:14px;font-size:16px;color:var(--pencil)}
.tally b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
.cover-fig svg{width:100%;height:auto}
.cf{font-family:var(--body);font-weight:600;font-size:15px;fill:var(--blue)}
.cf.big{font-size:24px;fill:var(--ink)}
.sec-h{font-size:24px;margin-bottom:6px}
.toc{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.toc li{border-bottom:1px solid var(--line)}
.toc button{display:grid;grid-template-columns:2.2em 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:16px 6px}
.toc .no{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.toc .t{display:block;font-family:var(--display);font-weight:700;font-size:22px}
.toc .d{display:block;font-size:15px;color:var(--pencil);margin-top:2px}
.toc .m{font-size:14px;color:var(--pencil);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.toc button:hover .t{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.toc button:hover{background:#fcfcf8}
.foot{display:flex;gap:10px;justify-content:center;align-items:center;color:var(--pencil)}

/* unit */
.chap{display:flex;gap:16px;align-items:center}
.chap-no{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;border-right:1.5px solid var(--ink);padding-right:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.c1{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.cdots{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.cdots span{width:18px;height:18px;border:1.5px solid var(--ink);background:var(--sheet)}
.cdots span.d{background:var(--ink)}
.cdots span.c{background:var(--hl)}
.keybox{background:var(--sheet);border:1.5px solid var(--ink)}
.keybox h3{background:var(--ink);color:#fff;font-family:var(--body);font-size:15px;letter-spacing:.04em;padding:7px 14px}
.flist{list-style:none;margin:0;padding:8px 16px 12px;display:flex;flex-direction:column}
.flist li{display:grid;grid-template-columns:7.5em 1fr;gap:12px;align-items:baseline;border-bottom:1px dashed var(--line);padding:7px 0}
.flist li:last-child{border-bottom:0}
.flist b{font-size:16px}
.flist span{font-size:17px}
.keybox.big .flist span{font-size:19px}

/* goal */
.goal{display:flex;flex-direction:column;gap:22px}
.mybest{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.mybest .v{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.mybest .v small{font-size:18px;margin-left:2px}
.spark{display:flex;align-items:flex-end;gap:6px;height:76px;padding:20px 4px 0;border-bottom:1.5px solid var(--ink);flex:1;min-width:200px}
.spark div{flex:1;max-width:28px;background:var(--sheet);border:1.5px solid var(--ink);border-bottom:0;position:relative}
.spark div.ok{background:var(--blue-soft);border-color:var(--blue)}
.spark div span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--pencil);font-variant-numeric:tabular-nums}
.goalpick{display:flex;align-items:center;gap:16px;justify-content:center;margin:4px 0 12px}
.goalpick output{font-family:var(--display);font-weight:700;font-size:60px;min-width:2.8em;text-align:center;font-variant-numeric:tabular-nums;border-bottom:2px solid var(--ink);line-height:1.15}
.goalpick output small{font-size:22px;margin-left:2px}
.goalpick .btn{min-width:68px}
.presets,.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rules{margin:0;padding:12px 16px 12px 32px;border:1px dashed var(--line);font-size:15px;color:var(--pencil)}

/* game */
.topbar{position:sticky;top:0;z-index:5;background:var(--paper);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0 10px;border-bottom:1.5px solid var(--ink)}
.tb-title{display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tb-title .mt{font-family:var(--display);font-weight:700;font-size:20px;text-align:center}
.lv{font-size:13px;font-weight:700;border:1.5px solid var(--ink);padding:0 8px;margin-top:3px}
.score{text-align:right;white-space:nowrap}
.score b{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.score span{font-size:16px;margin-left:2px}
.ruler{position:relative;height:28px;border:1.5px solid var(--ink);background:var(--sheet);overflow:hidden}
.ruler i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hl);transition:width .5s}
.ruler.hit i{background:#ffd8d2}
.ruler::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 10%),repeating-linear-gradient(90deg,var(--pencil) 0 1px,transparent 1px 2%);background-size:100% 13px,100% 7px;background-repeat:no-repeat}
.rulerlab{display:flex;justify-content:space-between;font-size:14px;color:var(--pencil);margin-top:4px;font-variant-numeric:tabular-nums}
.rulerlab #stk{color:var(--red);font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.qno{font-family:var(--display);font-weight:700;font-size:24px}
.qno small{font-size:16px;color:var(--pencil)}
.qno .tag{font-family:var(--body);font-size:13px;font-weight:700;color:var(--ink);border:1.5px solid var(--ink);padding:1px 8px;margin-left:10px;vertical-align:middle}
.icon{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px;min-height:40px;padding:4px 12px;font-size:15px;font-weight:600}
.icon:hover{background:var(--hl)}
.prompt{font-size:22px;line-height:1.65;margin-top:6px}
.prompt b{color:var(--ink);background:linear-gradient(transparent 60%,var(--hl) 60%)}
.pinote{font-size:15px;color:var(--pencil);white-space:nowrap}
.figbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0}
.fig{width:100%;max-width:380px;height:auto}
.fig .big{font-family:var(--body);font-weight:600;font-size:44px;fill:var(--ink)}
.fig .big.q{fill:var(--red)}
.fig .lbl{font-family:var(--body);font-weight:600;font-size:16px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.fig .or{fill:var(--orange)} .fig .bl{fill:var(--blue)} .fig .vi{fill:var(--violet)} .fig .gd{fill:var(--good)}
.fig .sm{font-family:var(--body);font-size:13px;fill:var(--pencil)}
.sfwrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.sec{transition:transform 1.1s cubic-bezier(.5,0,.2,1);transform-box:view-box;transform-origin:0 0}
.cl,.rl{transition:opacity .5s}
.rl{opacity:0}
.unf .rl{opacity:1}
.unf .cl{opacity:0}
.steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:16px 4px;border-top:1px dashed var(--line)}
.step.cur{background:linear-gradient(90deg,#fffbe0,transparent 70%)}
.step .sn{position:relative;width:32px;height:32px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;margin-top:2px}
.step.done .sn{color:var(--red)}
.step.done .sn::after{content:'';position:absolute;inset:-2px;border:2px solid var(--red);border-radius:50%;transform:rotate(-10deg)}
.sq{font-size:18px;margin-bottom:6px}
.sq b{background:linear-gradient(transparent 60%,var(--hl) 60%)}
.expr{font-size:22px;font-weight:500;line-height:2.4}
.slot{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 5px;line-height:1.2}
.slot input{font-family:var(--body);font-weight:600;font-size:23px;width:4.2em;text-align:center;padding:4px 2px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;color:var(--blue)}
.slot input:focus{outline:none;background:var(--hl)}
.slot input.bad{color:var(--red);background:var(--red-soft);text-decoration:line-through}
.slot input.good{background:var(--blue-soft)}
.slot small{font-size:12.5px;color:var(--pencil);margin-top:3px}
.slot .val{position:relative;display:inline-block;min-width:2.2em;text-align:center;color:var(--blue);font-weight:600;border-bottom:2px solid var(--ink);padding:0 6px}
.slot .val::after,.blank.ok::after,.opt.ok::after,.tok.ok::after{content:'';position:absolute;inset:-5px -7px;border:2px solid var(--red);border-radius:50%;transform:rotate(-4deg);pointer-events:none}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25;margin:0 4px}
.frac>span:first-child{border-bottom:2.5px solid var(--ink);padding:0 4px 3px}
.frac>span:last-child{padding-top:3px}
.frac .slot{margin:2px 0}
.frac .slot input{width:3em;font-size:20px;padding:1px 2px}
.frac .slot .val{border-bottom:0}
.blank{position:relative;display:inline-flex;align-items:flex-end;justify-content:center;min-width:4.6em;min-height:40px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;font-family:var(--body);font-weight:600;font-size:21px;color:var(--blue);padding:0 10px 2px;margin:0 4px;vertical-align:bottom;line-height:1.3}
.blank.active,.blank.hover{background:var(--hl)}
.blank.ok{cursor:default}
.blank.bad{color:var(--red);background:var(--red-soft);text-decoration:line-through;text-decoration-thickness:2px;animation:shake .35s}
.bank{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.chip{font-family:var(--body);font-weight:600;font-size:20px;padding:7px 16px;min-height:48px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;box-shadow:3px 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip:hover{background:var(--hl)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);background:var(--hl)}
.tip{font-size:14px;color:var(--pencil);margin-top:10px}
.opts{display:flex;flex-wrap:wrap;gap:12px}
.opt{position:relative;font-family:var(--body);font-weight:600;font-size:20px;padding:9px 22px;min-height:52px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px}
.opt:hover{background:var(--hl)}
.opt.ok{color:var(--blue);background:var(--sheet)}
.opt.no{color:var(--pencil);cursor:default;background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--red) calc(50% - 1.5px),var(--red) calc(50% + 1.5px),transparent calc(50% + 1.5px)),var(--sheet)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tok{position:relative;font-family:var(--body);font-weight:600;font-size:34px;min-width:66px;min-height:66px;border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet);font-variant-numeric:tabular-nums}
.tok:hover,.tok.sel{background:var(--hl)}
.tok.ok{color:var(--blue);background:var(--sheet)}
.tok.sym{border:0;background:transparent;min-width:22px;cursor:default}
.fb{min-height:1.6em;font-size:18px;margin-top:12px}
.fb.good{font-family:var(--hand);font-size:34px;line-height:1.1;color:var(--red)}
.fb.wrong{color:var(--red)}
.fb.reveal{color:var(--violet)}
.fb.info{color:var(--pencil)}
.donebox{border:1.5px dashed var(--red);padding:12px 16px;margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:18px}
.donebox.zero{border-color:var(--pencil)}
.pts{font-family:var(--hand);font-size:44px;line-height:1;color:var(--red)}
.donebox.zero .pts{color:var(--pencil)}
.bonus{font-family:var(--body);font-size:15px;color:var(--red);margin-left:10px;vertical-align:middle}
.lvmsg{font-weight:700;color:var(--violet)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* concept */
.csent{font-size:21px;line-height:2.5;margin-top:8px}
.example{border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 16px;margin-top:14px}
.example .exl{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--blue);margin-bottom:2px}

/* stamp */
.stamp{width:150px;height:150px;border-radius:50%;border:4px solid var(--red);box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 7px var(--red);color:var(--red);display:grid;place-items:center;text-align:center;font-family:var(--hand);font-size:40px;line-height:.95;transform:rotate(-12deg);margin:0 auto;animation:stampIn .35s ease-out;opacity:.92}
.stamp span{display:block}
.stamp.sm{width:96px;height:96px;font-size:26px;border-width:3px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--red)}
@keyframes stampIn{from{transform:rotate(-12deg) scale(1.9);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.92}}

/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.scorewrap{display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap}
.bigscore{font-family:var(--display);font-weight:700;font-size:84px;line-height:1;font-variant-numeric:tabular-nums}
.bigscore small{font-size:28px;margin-left:4px}
.win{font-size:20px;font-weight:600}
.near{font-size:20px;color:var(--pencil)}
.newbest{font-family:var(--hand);font-size:36px;color:var(--red);line-height:1}
.nextgoal{font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin:0;border:1.5px solid var(--ink)}
.stats div{padding:10px 8px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats dt{font-size:14px;color:var(--pencil)}
.stats dd{margin:0;font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.stats dd small{font-size:16px;color:var(--pencil)}

/* records */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:16px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:700;font-size:14px;color:var(--pencil);border-bottom:1.5px solid var(--ink)}
.tablewrap{overflow-x:auto}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(28,28,28,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:28px 24px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}

@media (max-width:640px){
  h1{font-size:40px} h2{font-size:26px}
  .cover{grid-template-columns:1fr;border-left-width:10px;padding:24px 18px}
  .cover-fig{max-width:200px}
  .grid2{grid-template-columns:1fr}
  .expr{font-size:20px}
  .slot input{width:3.7em;font-size:21px}
  .prompt{font-size:20px}
  .stats dd{font-size:22px}
  .toc .m{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .sec,.cl,.rl,.ruler i{transition:none}
  .shake,.blank.bad,.stamp{animation:none}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<noscript><p style="padding:20px">이 연습장은 자바스크립트가 켜져 있어야 해요.</p></noscript>
<script>
/* ================= 기본 도구 ================= */
const $=(s,el=document)=>el.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=n=>Math.round(n*10000)/10000;
const fmt=n=>String(rnd(n));

function sectorFig(o={}){

  const secs=[];for(let i=0;i<N;i++){const deg=i*360/N+180/N;secs.push({deg,lower:deg<90||deg>270,x:-Math.sin(deg*Math.PI/180)});}
  const lo=secs.filter(s=>s.lower).sort((p,q)=>p.x-q.x),up=secs.filter(s=>!s.lower).sort((p,q)=>p.x-q.x);
  const x0=cx-(N+1)*a/2,top=cy-h/2;
  lo.forEach((s,k)=>{s.tx=x0+a+2*a*k;s.ty=top;s.tr=s.deg>180?360:0;});
  up.forEach((s,k)=>{s.tx=x0+2*a+2*a*k;s.ty=top+h;s.tr=180;});

  const L=x0+a/2,Rx=x0+(N+.5)*a,by=top+h+12;

  return `<div class="sfwrap" id="${id}" ${o.auto?'data-auto="1"':''}><svg class="fig" viewBox="0 0 340 196" role="img" aria-label="원을 잘라 직사각형 모양으로 붙이는 그림">${g}

  </svg><button class="btn ghost sm" type="button">잘라서 붙이기</button></div>`;
}

/* ================= 낱말 끌어 놓기 ================= */
function dragChip(ch,root,onDrop){
  let sx=0,sy=0,ghost=null,over=null,pid=null;
  ch.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;sx=e.clientX;sy=e.clientY;pid=e.pointerId;try{ch.setPointerCapture(pid);}catch(_){}});
  ch.addEventListener('pointermove',e=>{if(pid!==e.pointerId)return;if(!ghost&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){ghost=ch.cloneNode(true);ghost.classList.add('ghost');document.body.appendChild(ghost);}
    if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const el=document.elementFromPoint(e.clientX,e.clientY);let b=el&&el.closest('.blank');if(b&&(!root.contains(b)||b.classList.contains('ok')))b=null;if(over&&over!==b)over.classList.remove('hover');over=b;if(b)b.classList.add('hover');}});
  const end=e=>{if(pid!==e.pointerId)return;pid=null;if(ghost){ghost.remove();ghost=null;if(over){over.classList.remove('hover');onDrop(over);over=null;}}else if(e.type==='pointerup')onDrop(null);};
  ch.addEventListener('pointerup',end);ch.addEventListener('pointercancel',end);
  ch.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onDrop(null);}});
}
function BlankSet(root,n){
  const st={vals:Array(n).fill(null),lock:Array(n).fill(false),active:0};
  const blanks=[...root.querySelectorAll('.blank')];
  const nextEmpty=(from=0)=>{for(let k=0;k<n;k++){const j=(from+k)%n;if(st.vals[j]==null&&!st.lock[j])return j;}return -1;};
  const paint=()=>blanks.forEach((b,i)=>{b.textContent=st.vals[i]??'';b.classList.toggle('filled',st.vals[i]!=null);b.classList.toggle('active',i===st.active&&!st.lock[i]);b.classList.toggle('ok',st.lock[i]);if(st.lock[i])b.classList.remove('bad');b.setAttribute('aria-label',`빈칸 ${i+1}: ${st.vals[i]??'비어 있음'}`);});
  const fill=(i,w)=>{if(i<0||st.lock[i])return;st.vals[i]=w;blanks[i].classList.remove('bad');const ne=nextEmpty(i+1);st.active=ne>=0?ne:i;paint();};
  blanks.forEach((b,i)=>b.addEventListener('click',()=>{if(st.lock[i])return;if(st.vals[i]!=null&&st.active===i)st.vals[i]=null;st.active=i;b.classList.remove('bad');paint();}));
  root.querySelectorAll('.chip').forEach(ch=>dragChip(ch,root,t=>{const w=ch.dataset.w;if(t)fill(+t.dataset.i,w);else{if(st.active<0||st.lock[st.active])st.active=nextEmpty(0);fill(st.active,w);}}));
  paint();
  return{st,paint,lockAt(i){st.lock[i]=true;},bad(i){blanks[i].classList.add('bad');},focusBad(){const i=st.lock.findIndex((l,k)=>!l&&blanks[k].classList.contains('bad'));if(i>=0)st.active=i;paint();},setAll(v){st.vals=[...v];st.lock.fill(true);paint();}};
}
const blankHTML=tpl=>{let i=0;return tpl.replace(/\{b\}/g,()=>`<button class="blank" type="button" data-i="${i++}"></button>`);};
const chipsHTML=bank=>`<div class="bank">${shuffle(bank).map(w=>`<button class="chip" type="button" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div><p class="tip">낱말 카드를 빈칸으로 끌어오거나, 노란 칸에 넣을 카드를 눌러요. 잘못 넣은 칸은 한 번 더 누르면 지워져요.</p>`;
function matchWords(vals,ans,any){if(!any)return vals.map((w,i)=>w===ans[i]);const pool=[...ans];return vals.map(w=>{const j=pool.indexOf(w);if(j>=0){pool.splice(j,1);return true;}return false;});}

function concept(uid,idx){
  const cards=CONCEPTS[uid],c=cards[idx];let tries=0;
  setScreen(`
  <button class="btn ghost sm back" type="button" id="bk">← ${UNITS[uid].title}</button>
  <article class="sheet" id="cc">
    <div class="qhead"><span class="qno">개념 ${idx+1}<small> / ${cards.length}</small></span>${sayBtn()}</div>
    <div class="cdots" aria-hidden="true">${cards.map((_,i)=>`<span class="${i<idx?'d':i===idx?'c':''}"></span>`).join('')}</div>
    <div class="figbox">${c.fig()}</div>
    <p class="csent" id="cs">${blankHTML(c.tpl)}</p>
    ${chipsHTML(c.bank)}
    <p class="fb" id="fb" role="status"></p>
    <div id="ex"></div>
    <div class="actions" id="acts"><button class="btn" type="button" id="chk">채점하기</button></div>
  </article>`);
  sayText=()=>c.tpl.replace(/\{b\}/g,' 빈칸 ').replace(/<br>/g,'. ').replace(/<[^>]+>/g,' ');
  initFigs(app);
  const bs=BlankSet($('#cc'),c.ans.length),fb=(t,k)=>{const e=$('#fb');e.className='fb '+k;e.innerHTML=t;};
  $('#bk').onclick=()=>unit(uid);
  const finish=first=>{const pl=player();if(first)pl.total+=5;pl.concept[uid]=Math.max(pl.concept[uid]||0,idx+1);save();
    $('#ex').innerHTML=`<div class="example"><p class="exl">예시</p><p>${c.ex()}</p></div>`;
    app.querySelector('.bank').remove();app.querySelector('.tip').remove();
    const last=idx===((EMBED&&+QP.get('to'))?Math.min(+QP.get('to'),cards.length):cards.length)-1;$('#acts').innerHTML=`<button class="btn blue" type="button" id="nx">${last?'개념 정리 보기 →':'다음 개념 →'}</button>`;
    $('#nx').onclick=()=>last?conceptSummary(uid):concept(uid,idx+1);$('#nx').focus();};
  $('#chk').onclick=()=>{
    const v=bs.st.vals;if(v.some(x=>x==null)){fb('빈칸을 모두 채워요.','info');return;}
    const ok=matchWords(v,c.ans,c.any);
    if(ok.every(Boolean)){ok.forEach((_,i)=>bs.lockAt(i));bs.paint();sndGood();fb(tries===0?'참 잘했어요 +5':'잘 고쳤어요','good');finish(tries===0);return;}
    tries++;sndBad();ok.forEach((o,i)=>o?bs.lockAt(i):bs.bad(i));bs.focusBad();
    if(tries>=2){bs.setAll(c.ans);fb('정답을 채워 두었어요. 소리 내어 한 번 읽어 봐요.','reveal');finish(false);}

  };
}

const round10=x=>Math.ceil(x/10)*10;
function goal(modeId){

  let g=best?beat:50,lv=pl.level[modeId]||1;

        <div class="presets">${[30,50,100,150,200].map(x=>`<button class="pill ${x===g?'on':''}" type="button" data-g="${x}">${x}</button>`).join('')}${best?`<button class="pill hot ${g===beat?'on':''}" type="button" data-g="${beat}">최고 기록 넘기 ${beat}</button>`:''}</div></div>
      <div><p class="label">시작 레벨</p><div class="seg">${[[1,'1 쉬움'],[2,'2 보통'],[3,'3 도전']].map(([v,t])=>`<button class="pill ${v===lv?'on':''}" type="button" data-lv="${v}">${t}</button>`).join('')}</div></div>
      <ul class="rules"><li>처음에 바로 맞히면 10점, 힌트를 보거나 고쳐서 맞히면 5점</li><li>3문제 연속으로 바로 맞히면 5점 더</li><li>5문제 연속으로 바로 맞히면 레벨이 올라가요</li><li>목표를 넘으면 도장을 받고, 목표를 더 올려서 계속할 수 있어요</li></ul>
      <button class="btn big blue" type="button" id="go">목표 ${g}점으로 시작하기</button>
    </article>`);
    $('#bk').onclick=()=>unit(M.unit);
    $('#gm').onclick=()=>{g=Math.max(10,g-10);draw();};$('#gp').onclick=()=>{g=Math.min(2000,g+10);draw();};
    app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=+b.dataset.g;draw();});
    app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;draw();});

}

let G=null;
function startGame(mode,goalPts,level){const pl=player();G={mode,goal:goalPts,level,score:0,streak:0,perfRun:0,revRun:0,solved:0,first:0,goalHit:false,stampsNow:0,prevBest:pl.best[mode]||0};nextQuestion();}
function nextQuestion(){
  G.q=MODES[G.mode].gen(G.level);G.stepIdx=0;G.attempts=0;G.qMistake=false;G.qHint=false;G.qRevealed=false;G.qDone=false;

function updateTop(){
  $('#sc').textContent=G.score;$('#gl').textContent=G.goal;$('#lvl').textContent='레벨 '+G.level;
  const pct=Math.min(100,G.score/G.goal*100);$('#gb').style.width=pct+'%';$('#gbar').setAttribute('aria-valuenow',Math.round(pct));$('#gbar').classList.toggle('hit',G.score>=G.goal);
  $('#stk').textContent=G.streak>=2?`${G.streak}문제 연속 정답`:'';

function renderFill(st,done,pre){let i=0;return st.tpl.replace(/\{n(?::([^}]*))?\}/g,(m,cap)=>{const k=i++,ch=cap?`<small>${cap}</small>`:'';if(done)return `<span class="slot done"><span class="val">${st.money?Number(st.ans[k]).toLocaleString('ko-KR'):fmt(st.ans[k])}</span>${ch}</span>`;return `<span class="slot"><input id="${pre}-${k}" inputmode="decimal" autocomplete="off" aria-label="${cap||'답'} 입력">${ch}</span>`;});}
function stepHTML(st,k,state){
  const done=state==='done';let b=st.q?`<p class="sq">${st.q}</p>`:'';
  if(st.type==='fill')b+=`<div class="expr">${renderFill(st,done,'s'+k)}</div>`;
  if(st.type==='formula'){if(done){let i=0;b+=`<div class="expr">${st.tpl.replace(/\{b\}/g,()=>`<span class="blank ok">${st.ans[i++]}</span>`)}</div>`;}else b+=`<div class="expr">${blankHTML(st.tpl)}</div>${chipsHTML(st.bank)}`;}
  if(st.type==='choice')b+=done?`<div class="opts"><span class="opt ok">${st.ans}</span></div>`:`<div class="opts">${st.opts.map(o=>`<button class="opt" type="button" data-o="${esc(o)}">${o}</button>`).join('')}</div>`;
  if(st.type==='tap')b+=`<div class="tokens">${st.tokens.map((t,i)=>typeof t==='number'?`<button class="tok ${done&&st.ans.includes(i)?'ok':''}" type="button" data-i="${i}" ${done?'disabled':''}>${t}</button>`:`<span class="tok sym">${t}</span>`).join('')}</div>`;
  return `<li class="step ${state}"><span class="sn">${k+1}</span><div>${b}</div></li>`;
}
function renderSteps(){
  const q=G.q,upto=G.qDone?q.steps.length:G.stepIdx+1;
  $('#steps').innerHTML=q.steps.slice(0,upto).map((st,k)=>stepHTML(st,k,(G.qDone||k<G.stepIdx)?'done':'cur')).join('');
  renderActions();
  if(!G.qDone){wireCurrent();const li=$('#steps .step.cur');if(li&&G.stepIdx>0)li.scrollIntoView({block:'nearest',behavior:'smooth'});}
}
function renderActions(){
  const a=$('#acts');
  if(G.qDone){a.innerHTML=`<button class="btn blue" type="button" id="nq">다음 문제 →</button>`;$('#nq').onclick=nextQuestion;setTimeout(()=>{const n=$('#nq');if(n&&!$('.overlay'))n.focus();},60);return;}
  const st=G.q.steps[G.stepIdx],need=st.type==='fill'||st.type==='formula'||(st.type==='tap'&&st.ans.length>1);
  a.innerHTML=`<button class="btn ghost" type="button" id="hint">힌트 보기</button>${need?'<button class="btn" type="button" id="chk">채점하기</button>':''}`;
  $('#hint').onclick=()=>{G.qHint=true;fb(`<span class="hl">힌트</span> ${st.hint||'꼭 기억할 것을 떠올려 봐요.'} <span class="small">(힌트를 보면 이 문제는 5점)</span>`,'info');};
  if(need)$('#chk').onclick=check;
}
function fb(t,k){const e=$('#fb');e.className='fb '+k;e.innerHTML=t;}
function wireCurrent(){
  const st=G.q.steps[G.stepIdx],li=$('#steps .step.cur');if(!li)return;
  if(st.type==='fill'){const ins=[...li.querySelectorAll('input')];
    ins.forEach(inp=>{inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const nx=ins.find(x=>x!==inp&&!x.readOnly&&x.value.trim()==='');if(inp.value.trim()!==''&&nx)nx.focus();else check();}});inp.addEventListener('input',()=>inp.classList.remove('bad'));});
    setTimeout(()=>{const f=ins.find(x=>!x.value);if(f)f.focus({preventScroll:true});},40);}
  if(st.type==='formula')G.bs=BlankSet(li,st.ans.length);
  if(st.type==='choice')li.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;if(b.dataset.o===st.ans){b.classList.add('ok');stepRight();}else{b.classList.add('no');b.disabled=true;stepWrong();}});
  if(st.type==='tap')li.querySelectorAll('.tok[data-i]').forEach(b=>b.onclick=()=>{if(st.ans.length===1){li.querySelectorAll('.tok').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');check();}else b.classList.toggle('sel');});
}
function check(){
  const st=G.q.steps[G.stepIdx],li=$('#steps .step.cur');
  if(st.type==='fill'){const ins=[...li.querySelectorAll('input')];
    if(ins.some(i=>i.value.trim()==='')){fb('빈칸을 모두 채워요.','info');const f=ins.find(i=>i.value.trim()==='');f&&f.focus();return;}
    const vals=ins.map(i=>parseNum(i.value)),ok=st.check?st.check(vals):vals.map((v,i)=>eq(v,st.ans[i]));
    if(ok.every(Boolean))return stepRight();
    ins.forEach((inp,i)=>{inp.classList.toggle('bad',!ok[i]);inp.classList.toggle('good',!!ok[i]);if(ok[i])inp.readOnly=true;});
    const bad=ins.find((_,i)=>!ok[i]);if(bad){bad.focus();bad.select();}
    return stepWrong();}
  if(st.type==='formula'){const v=G.bs.st.vals;if(v.some(x=>x==null)){fb('빈칸을 모두 채워요.','info');return;}
    const ok=matchWords(v,st.ans,st.any);if(ok.every(Boolean))return stepRight();
    ok.forEach((o,i)=>o?G.bs.lockAt(i):G.bs.bad(i));G.bs.focusBad();return stepWrong();}
  if(st.type==='tap'){const sel=[...li.querySelectorAll('.tok.sel')].map(b=>+b.dataset.i);
    if(sel.length!==st.ans.length){fb(`${st.ans.length}개를 골라요.`,'info');return;}
    if(sel.every(i=>st.ans.includes(i)))return stepRight();
    li.querySelectorAll('.tok.sel').forEach(b=>b.classList.remove('sel'));return stepWrong();}
}
const PRAISE=['맞았어요','정답','좋아요','바로 그거예요','잘했어요'];
function stepRight(){sndGood();fb(pick(PRAISE),'good');G.stepIdx++;G.attempts=0;if(G.stepIdx>=G.q.steps.length)finishQuestion();else renderSteps();}
function stepWrong(){
  sndBad();G.attempts++;G.qMistake=true;const st=G.q.steps[G.stepIdx],li=$('#steps .step.cur');
  if(li){li.classList.remove('shake');void li.offsetWidth;li.classList.add('shake');}
  if(G.attempts>=2){G.qRevealed=true;fb(`정답을 적어 두었어요. 파란 글씨 답을 보고 왜 그런지 생각해 봐요. <span class="hl">힌트</span> ${st.hint||''}`,'reveal');G.stepIdx++;G.attempts=0;if(G.stepIdx>=G.q.steps.length)finishQuestion();else renderSteps();}
  else fb(`다시 한 번 해 봐요. <span class="hl">힌트</span> ${st.hint||''}`,'wrong');
}
function finishQuestion(){
  const perfect=!G.qMistake&&!G.qHint,pts=G.qRevealed?0:perfect?10:5;let bonus=0,lvMsg='';
  if(perfect){G.streak++;G.perfRun++;G.first++;if(G.streak>=3)bonus=5;}else{G.streak=0;G.perfRun=0;}
  G.revRun=G.qRevealed?G.revRun+1:0;G.score+=pts+bonus;G.solved++;
  if(G.perfRun>=5&&G.level<3){G.level++;G.perfRun=0;lvMsg=`레벨 업! 이제 레벨 ${G.level} 문제가 나와요.`;}
  if(G.revRun>=2&&G.level>1){G.level--;G.revRun=0;lvMsg=`레벨 ${G.level} 문제로 바꿨어요. 차근차근 다시 해 봐요.`;}
  const pl=player();pl.total+=pts+bonus;pl.best[G.mode]=Math.max(pl.best[G.mode]||0,G.score);pl.level[G.mode]=G.level;save();
  G.qDone=true;
  if(G.q.figDone)$('#fig').innerHTML=G.q.figDone;
  renderSteps();
  $('#donebox').innerHTML=`<div class="donebox ${pts?'':'zero'}"><p class="pts">+${pts+bonus}${bonus?`<span class="bonus">연속 정답 +${bonus} 포함</span>`:''}</p>${pts?'':'<p>이번 문제는 정답을 보고 익혔어요. 다음엔 막히면 힌트를 먼저 눌러 봐요.</p>'}<p>${G.q.done||''}</p>${lvMsg?`<p class="lvmsg">${lvMsg}</p>`:''}</div>`;
  updateTop();
  if(G.score>=G.goal&&!G.goalHit){G.goalHit=true;setTimeout(celebrate,450);}
}
function celebrate(){if(EMBED)post({type:'goal',mode:G.mode,score:G.score,goal:G.goal,solved:G.solved,first:G.first,level:G.level});
  sndWin();const pl=player();pl.stamps=(pl.stamps||0)+1;G.stampsNow++;save();
  const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="stamp" aria-hidden="true"><span>참<br>잘했어요</span></div><h2 id="ovt">목표 ${G.goal}점 달성</h2><p>${esc(S.name)}, 도장을 하나 받았어요. 지금까지 모은 도장은 ${pl.stamps}개예요.</p><p class="small">목표를 더 올려서 계속해 볼까요?</p><button class="btn big blue" type="button" id="up">목표 +50점 올려서 계속하기</button><button class="btn ghost" type="button" id="fin">여기서 끝내기</button></div>`;
  document.body.appendChild(ov);$('#up').focus();
  $('#up').onclick=()=>{G.goal+=50;G.goalHit=false;ov.remove();updateTop();const n=$('#nq');n&&n.focus();};
  $('#fin').onclick=()=>{ov.remove();endGame();};
}
function endGame(){
  const ov=$('.overlay');if(ov)ov.remove();
  if(!G||G.solved===0){const u=MODES[G?G.mode:'c_mix'].unit;G=null;unit(u);return;}
  const pl=player(),ok=G.score>=G.goal||G.stampsNow>0,newBest=G.score>G.prevBest,best=Math.max(G.prevBest,G.score),next=round10(best+10);
  pl.history.unshift({d:Date.now(),m:G.mode,s:G.score,g:G.goal,ok,n:G.solved,f:G.first});pl.history=pl.history.slice(0,60);save();if(EMBED)post({type:'session',mode:G.mode,score:G.score,goal:G.goal,achieved:ok,solved:G.solved,first:G.first,level:G.level});
  const M=MODES[G.mode],acc=Math.round(G.first/G.solved*100),g=G;
  setScreen(`
  <article class="sheet result">
    <p class="label">${M.title} · 레벨 ${g.level}</p>
    <div class="scorewrap"><div class="bigscore">${g.score}<small>점</small></div>${g.stampsNow?'<div class="stamp sm" aria-label="참 잘했어요 도장"><span>참<br>잘했어요</span></div>':''}</div>
    <p class="${ok?'win':'near'}">${ok?`목표를 넘었어요. 이번 도전에서 도장 ${g.stampsNow}개를 받았어요.`:`목표 ${g.goal}점까지 ${g.goal-g.score}점 남았어요. 다음엔 할 수 있어요.`}</p>
    ${newBest?'<p class="newbest">새 최고 기록!</p>':''}
    <dl class="stats"><div><dt>푼 문제</dt><dd>${g.solved}</dd></div><div><dt>바로 맞힌 문제</dt><dd>${g.first}</dd></div><div><dt>바로 맞힌 비율</dt><dd>${acc}%</dd></div></dl>
    <p class="nextgoal">최고 기록 <b>${best}점</b> → 다음 목표 <b class="red">${next}점</b></p>
    <div class="actions" style="justify-content:center"><button class="btn ghost" type="button" id="toUnit">${EMBED?'과제 목록으로':'다른 문제 고르기'}</button><button class="btn blue" type="button" id="again">${next}점 목표로 다시 하기</button></div>
  </article>`);
  $('#toUnit').onclick=()=>unit(M.unit);$('#again').onclick=()=>startGame(g.mode,next,player().level[g.mode]||1);
  G=null;
}

/* ================= 화면: 기록 ================= */
function records(name,confirmDel){
  const names=Object.keys(DB.players);
  if(!names.length){setScreen(`<button class="btn ghost sm back" type="button" id="bk">← 차례</button><article class="sheet"><h2>학생 기록</h2><p class="small" style="margin-top:8px">아직 기록이 없어요. 표지에서 이름을 정하고 문제를 풀어 보세요.</p></article>`);$('#bk').onclick=()=>home();return;}
  if(!DB.players[name])name=names[0];
  const pl=DB.players[name],dt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
  setScreen(`
  <button class="btn ghost sm back" type="button" id="bk">← 차례</button>
  <h2>학생 기록</h2>
  <div class="names">${names.map(n=>`<button class="pill ${n===name?'on':''}" type="button" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>
  <section class="sheet"><dl class="stats"><div><dt>모은 점수</dt><dd>${pl.total}</dd></div><div><dt>받은 도장</dt><dd>${pl.stamps||0}</dd></div><div><dt>개념 카드</dt><dd>${(pl.concept.circle||0)+(pl.concept.ratio||0)}<small> / ${CONCEPTS.circle.length+CONCEPTS.ratio.length}</small></dd></div></dl></section>
  <section class="sheet"><p class="label">연습 문제별 기록</p><div class="tablewrap"><table><thead><tr><th>단원</th><th>연습 문제</th><th>최고 점수</th><th>레벨</th><th>도전</th></tr></thead><tbody>
  ${Object.keys(MODES).map(m=>`<tr><td>${MODES[m].unit==='circle'?'원':'비례'}</td><td>${MODES[m].title}</td><td>${pl.best[m]||0}</td><td>${pl.level[m]||1}</td><td>${pl.history.filter(h=>h.m===m).length}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="sheet"><p class="label">최근 도전</p>${pl.history.length?`<div class="tablewrap"><table><thead><tr><th>날짜</th><th>연습 문제</th><th>점수 / 목표</th><th>바로 맞힘</th><th>달성</th></tr></thead><tbody>${pl.history.slice(0,15).map(h=>`<tr><td>${dt(h.d)}</td><td>${MODES[h.m]?MODES[h.m].title:h.m}</td><td>${h.s} / ${h.g}</td><td>${h.f} / ${h.n}</td><td>${h.ok?'<span class="red">○</span>':''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small">아직 끝낸 도전이 없어요.</p>'}</section>
  <div class="row" style="justify-content:flex-end">${confirmDel?`<span class="warn" style="margin:0">${esc(name)}의 기록을 정말 지울까요?</span><button class="btn ghost sm" type="button" id="no">취소</button><button class="btn sm danger" type="button" id="yes">지우기</button>`:`<button class="textbtn" type="button" id="del">${esc(name)} 기록 지우기</button>`}</div>`);
  $('#bk').onclick=()=>home();
  app.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>records(b.dataset.name));
  if(confirmDel){$('#no').onclick=()=>records(name);$('#yes').onclick=()=>{delete DB.players[name];if(S.name===name){S.name='';DB.settings.last='';}save();records(Object.keys(DB.players)[0]);};}
  else $('#del').onclick=()=>records(name,true);
}

if(EMBED){S.name=QP.get('name')||'학생';player(S.name);const md=QP.get('mode')||'c_mix';home=()=>post({type:'close'});unit=()=>post({type:'close'});if(md.startsWith('concept-'))concept(md.slice(8),Math.max(0,+QP.get('from')||0));else startGame(md,+QP.get('goal')||50,+QP.get('level')||1);}else home();
</script>
